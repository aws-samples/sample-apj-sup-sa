stages:
  - lint
  - test

# Version checks: decider.control, the install script and decider_version() must agree.
version-consistency:
  stage: lint
  image: public.ecr.aws/docker/library/alpine:3.20
  script:
    - V=$(sed -n "s/^default_version *= *'\(.*\)'/\1/p" decider.control)
    - echo "decider.control default_version = $V"
    - test -f "sql/decider--$V.sql"
    - grep -q "SELECT '$V'" "sql/decider--$V.sql"
    - grep -q "## $V" CHANGELOG.md

# pg_regress against the mock decider server on every supported PostgreSQL major.
regress:
  stage: test
  image: public.ecr.aws/docker/library/postgres:${PG_MAJOR}
  parallel:
    matrix:
      - PG_MAJOR: ["14", "15", "16", "17"]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends postgresql-plpython3-${PG_MAJOR} postgresql-server-dev-${PG_MAJOR} make python3
    - make install
    - chown -R postgres:postgres "$CI_PROJECT_DIR"
  script:
    - su postgres -c "bash test/run.sh"
  artifacts:
    when: on_failure
    paths:
      - test/regression.diffs
      - test/results/
