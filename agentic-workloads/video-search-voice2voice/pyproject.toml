[project]
name = "talk2vid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.56",
    "deepgram-sdk>=7.8.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pipecat-ai[aws,daily,deepgram,runner,silero,webrtc]==1.8.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
]

[project.scripts]
talk2vid = "talk2vid.server:main"
talk2vid-ingest = "talk2vid.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talk2vid"]
