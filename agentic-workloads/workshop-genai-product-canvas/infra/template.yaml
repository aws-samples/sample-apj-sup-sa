        "canvas/product-canvas-reference.md": ""
        "skills/deploy-to-agentcore/SKILL.md": ""
      DataFiles:
        detections.json: ""
        land_use_changes.json: ""
        news_articles.json: ""
        species_baselines.json: ""
        weather.json: ""
      Version: "1"

  # Creates Cognito + AgentCore Gateway + target, writes gateway.env to SSM.
  # Runs after Provisioner has injected its real code.
  GatewaySetup:
    Type: Custom::GatewaySetup
    DependsOn:
      - Provisioner
    Properties:
      ServiceToken: !GetAtt GatewaySetupFunction.Arn
      ProjectName: !Ref ProjectName
      ToolsFunctionArn: !GetAtt ToolsFunction.Arn
      SsmParamName: !Ref SsmParamName

Outputs:
  AgentSourceUri:
    Description: >-
      S3 prefix holding the baseline agent source. The Part 0 Code Editor stack
      syncs this into the participant workspace at boot.
    Value: !Sub "s3://${DataBucket}/workspace/"
  DataBucketName:
    Description: S3 bucket holding the wildlife datasets (seeded under data/).
    Value: !Ref DataBucket
  AuditBucketName:
    Description: S3 bucket holding audit logs and published reports.
    Value: !Ref AuditBucket
  ToolsFunctionArn:
    Description: Lambda ARN registered as the AgentCore Gateway target.
    Value: !GetAtt ToolsFunction.Arn
  GatewayUrl:
    Description: >-
      The AgentCore Gateway MCP endpoint. The workshop itself does not read this -
      it takes the endpoint from the GatewayEnvParameter SecureString below, which
      also carries the Cognito credentials. This output is here for diagnostics.
    Value: !GetAtt GatewaySetup.GatewayUrl
  GatewayEnvParameter:
    Description: >-
      SSM SecureString parameter holding the full gateway.env (endpoints +
      Cognito client secret). Fetch it with:
      aws ssm get-parameter --name <value> --with-decryption
      --query Parameter.Value --output text > gateway.env
    Value: !Ref SsmParamName
