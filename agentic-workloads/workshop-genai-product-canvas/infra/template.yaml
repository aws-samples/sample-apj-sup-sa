AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Touch Grass Workshop - single-stack backend for the Biodiversity Anomaly
  Detection Agent. One stack provisions everything the participant needs:
  the data + audit S3 buckets, the tools Lambda (with real code injected), the
  seeded datasets, AND the AgentCore Gateway + Cognito auth. All assets (handler
  code, tool contract, datasets) are embedded in this template as gzip+base64
  blobs - there is NO external repo, no pre-upload, and no provisioning scripts.
  Deploy with a single `aws cloudformation deploy`. The gateway connection
  details are written to an SSM SecureString parameter. Regenerate the embedded
  blobs with infra/bundle_assets.py whenever the source files change.

Parameters:
  ProjectName:
    Type: String
    Default: biodiversity-anomaly
    Description: Prefix for resource names.

  SsmParamName:
    Type: String
    Default: /touch-grass/gateway-env
    Description: SSM SecureString parameter that will hold the gateway.env contents.

Resources:
  # Server access log destination for the data + audit buckets. To satisfy the
  # "S3 access logging enabled" control on every bucket, this bucket also logs
  # its own access to itself under a separate prefix (log-bucket-access-logs/).
  # Self-logging to a distinct prefix is a supported S3 pattern and keeps the
  # log bucket from being an unlogged blind spot. ACLs are disabled
  # (BucketOwnerEnforced); the S3 logging service principal is granted write
  # access for the data, audit, and log buckets through LogBucketPolicy below.
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: log-bucket-access-logs/

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogsWrite
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:aws:s3:::${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-data-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-audit-${AWS::AccountId}-${AWS::Region}"

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: data-access-logs/

  AuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-audit-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: audit-access-logs/

  ToolsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-tools-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tool-data-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "${AuditBucket.Arn}/*"

  ToolsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-tools"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt ToolsFunctionRole.Arn
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          AUDIT_BUCKET: !Ref AuditBucket
      Code:
        # Placeholder. The Provisioner injects the real code from ToolsCodePath.
        ZipFile: |
          def handler(event, context):
              return {"error": "tools not yet provisioned"}

  GatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ToolsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com

  # --- Gateway setup Lambda (backs the GatewaySetup custom resource) ---------
  GatewaySetupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gwsetup-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: gateway-setup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CreateUserPool generates the pool ID server-side, so it cannot
              # be bound to a specific userpool ARN. Constrain it to this region
              # instead of leaving it fully unconstrained on "*".
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # The remaining actions operate on an existing pool, so scope them
              # to user pools in this account + region.
              - Effect: Allow
                Action:
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DescribeUserPool
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                # Scoped to AgentCore resources in this account + region.
                Resource: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-gateway-role"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-gateway-role"
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParamName}*"

  GatewaySetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-gwsetup"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt GatewaySetupRole.Arn
      Code:
        # Placeholder. The Provisioner injects the real handler from GatewayCodePath
        # (plus tool_definition.json) before the GatewaySetup resource runs.
        ZipFile: |
          def handler(event, context):
              return {"error": "gateway setup not yet provisioned"}

  # --- Provisioner: seeds data + injects both Lambda code bundles ------------
  ProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-provisioner-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: provision
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource:
                  - !GetAtt ToolsFunction.Arn
                  - !GetAtt GatewaySetupFunction.Arn

  ProvisionerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-provisioner"
      Description: Seeds datasets to S3 and injects the tools + gateway Lambda code (all embedded, no external source).
      Runtime: python3.12
      Handler: index.handler
      # Writes embedded (gzip+base64) assets to S3 and injects code into two
      # Lambdas, waiting for each (_wait polls up to ~120s each). 900s (Lambda
      # max) gives ample headroom.
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt ProvisionerRole.Arn
      Code:
        ZipFile: |
          import io, json, time, gzip, base64, zipfile, urllib.request, boto3
          s3 = boto3.client("s3"); lam = boto3.client("lambda")

          # Self-contained CloudFormation responder. We do NOT rely on the
          # auto-injected `cfnresponse` module (it is not always present for
          # inline ZipFile functions, which caused ImportModuleError here).
          def _send(event, context, status, data=None, physical_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False, "Data": data or {},
              }).encode()
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              urllib.request.urlopen(req, timeout=30)

          def _wait(fn):
              for _ in range(60):
                  c = lam.get_function(FunctionName=fn)["Configuration"]
                  if c.get("LastUpdateStatus") != "InProgress":
                      return
                  time.sleep(2)

          def _zip(files):
              b = io.BytesIO()
              with zipfile.ZipFile(b, "w", zipfile.ZIP_DEFLATED) as z:
                  for n, data in files.items():
                      z.writestr(n, data)
              return b.getvalue()

          def _un(b64):  # gzip+base64 blob -> raw bytes
              return gzip.decompress(base64.b64decode(b64))

          def handler(event, context):
              rt = event.get("RequestType", "")
              p = event.get("ResourceProperties", {})
              bucket = p["DataBucket"]; tools_fn = p["ToolsFunction"]
              gw_fn = p["GatewayFunction"]
              try:
                  if rt in ("Create", "Update"):
                      # All assets are embedded in the template (gzip+base64) and
                      # passed via ResourceProperties - no external repo or S3 stage.
                      n = 0
                      for name, b64 in p.get("DataFiles", {}).items():
                          s3.put_object(Bucket=bucket, Key="data/" + name,
                                        Body=_un(b64),
                                        ContentType="application/json")
                          n += 1
                      lam.update_function_code(
                          FunctionName=tools_fn,
                          ZipFile=_zip({"index.py": _un(p["ToolsCodeB64"])}))
                      _wait(tools_fn)
                      lam.update_function_code(
                          FunctionName=gw_fn,
                          ZipFile=_zip({"index.py": _un(p["GatewayCodeB64"]),
                                        "tool_definition.json": _un(p["ToolDefB64"])}))
                      _wait(gw_fn)
                      _send(event, context, "SUCCESS",
                            {"FilesUploaded": str(n)}, "provisioner")
                  elif rt == "Delete":
                      # Empty the bucket so DataBucket can be deleted on teardown.
                      pag = s3.get_paginator("list_objects_v2"); d = 0
                      for page in pag.paginate(Bucket=bucket):
                          objs = [{"Key": o["Key"]} for o in page.get("Contents", [])]
                          if objs:
                              s3.delete_objects(Bucket=bucket, Delete={"Objects": objs})
                              d += len(objs)
                      _send(event, context, "SUCCESS",
                            {"FilesDeleted": str(d)}, "provisioner")
                  else:
                      _send(event, context, "SUCCESS", {}, "provisioner")
              except Exception as e:
                  _send(event, context, "FAILED", {"Error": str(e)}, "provisioner",
                        reason=str(e))

  Provisioner:
    Type: Custom::ToolsProvisioner
    DependsOn:
      - DataBucket
      - ToolsFunction
      - GatewaySetupFunction
    Properties:
      ServiceToken: !GetAtt ProvisionerFunction.Arn
      DataBucket: !Ref DataBucket
      ToolsFunction: !Ref ToolsFunction
      GatewayFunction: !Ref GatewaySetupFunction
      # ----------------------------------------------------------------------
      # Embedded assets (gzip + base64). GENERATED by infra/bundle_assets.py -
      # do not edit by hand. Re-run that script whenever the tools handler,
      # gateway handler, tool_definition.json, or agent/data/*.json change.
      # ----------------------------------------------------------------------
      ToolsCodeB64: ""
      GatewayCodeB64: ""
      ToolDefB64: ""
      DataFiles:
        detections.json: ""
        land_use_changes.json: ""
        news_articles.json: ""
        species_baselines.json: ""
        weather.json: ""
      Version: "1"

  # Creates Cognito + AgentCore Gateway + target, writes gateway.env to SSM.
  # Runs after Provisioner has injected its real code.
  GatewaySetup:
    Type: Custom::GatewaySetup
    DependsOn:
      - Provisioner
    Properties:
      ServiceToken: !GetAtt GatewaySetupFunction.Arn
      ProjectName: !Ref ProjectName
      ToolsFunctionArn: !GetAtt ToolsFunction.Arn
      SsmParamName: !Ref SsmParamName

Outputs:
  DataBucketName:
    Description: S3 bucket holding the wildlife datasets (seeded under data/).
    Value: !Ref DataBucket
  AuditBucketName:
    Description: S3 bucket holding audit logs and published reports.
    Value: !Ref AuditBucket
  LogBucketName:
    Description: >-
      S3 bucket holding server access logs for the data + audit buckets. Not
      auto-emptied on delete - empty it before deleting the stack.
    Value: !Ref LogBucket
  ToolsFunctionArn:
    Description: Lambda ARN registered as the AgentCore Gateway target.
    Value: !GetAtt ToolsFunction.Arn
  GatewayUrl:
    Description: The AgentCore Gateway MCP endpoint.
    Value: !GetAtt GatewaySetup.GatewayUrl
  GatewayEnvParameter:
    Description: >-
      SSM SecureString parameter holding the full gateway.env (endpoints +
      Cognito client secret). Fetch it with:
      aws ssm get-parameter --name <value> --with-decryption
      --query Parameter.Value --output text > gateway.env
    Value: !Ref SsmParamName
