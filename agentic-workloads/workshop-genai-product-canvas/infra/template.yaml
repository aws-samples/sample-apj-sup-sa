AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Touch Grass Workshop - single-stack backend for the Biodiversity Anomaly
  Detection Agent. One stack provisions everything the participant needs:
  the data + audit S3 buckets, the tools Lambda (with real code injected), the
  seeded datasets, AND the AgentCore Gateway + Cognito auth. All assets (handler
  code, tool contract, datasets) are embedded in this template as gzip+base64
  blobs - there is NO external repo, no pre-upload, and no provisioning scripts.
  Deploy with a single `aws cloudformation deploy`. The gateway connection
  details are written to an SSM SecureString parameter. Regenerate the embedded
  blobs with infra/bundle_assets.py whenever the source files change.

Parameters:
  ProjectName:
    Type: String
    Default: biodiversity-anomaly
    Description: Prefix for resource names.

  SsmParamName:
    Type: String
    Default: /touch-grass/gateway-env
    Description: SSM SecureString parameter that will hold the gateway.env contents.

Resources:
  # Server access logs for the two buckets below, and for itself. Self-logging
  # is what lets every bucket in this stack satisfy access logging without an
  # endless chain of log buckets; the Provisioner empties all three on delete so
  # the accumulated logs cannot block teardown.
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LoggingConfiguration:
        DestinationBucketName: !Sub "${ProjectName}-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: access-logs/logs/
      # Versioning is what makes an overwrite recoverable, and an access-log
      # bucket is exactly where a tamper would land. The Provisioner deletes
      # every version at teardown, so this cannot strand the stack.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1

  # S3 server access logging delivers through the logging.s3.amazonaws.com
  # service principal, so the destination bucket needs a policy granting it.
  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${LogBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub "${LogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # Every bucket refuses plain HTTP. Cheap, and it is the one bucket control the
  # workshop was missing: PublicAccessBlock and SSE were already there, but nothing
  # stopped a request arriving over HTTP in the first place.
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  AuditBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AuditBucket.Arn
              - !Sub "${AuditBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: access-logs/data/
      # The tools have read-only access here, so a version history is what
      # proves the datasets an agent read were the ones the stack wrote.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 1

  AuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-audit-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: access-logs/audit/
      # This is the bucket the tools write to and never read. Versioning means a
      # later write cannot quietly replace an earlier report - the property you
      # want from anything you would call an audit trail.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-versions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 1

  ToolsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-tools-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tool-data-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub "${AuditBucket.Arn}/*"

  ToolsFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_116: invoked synchronously by the AgentCore Gateway,
    #   which surfaces the error to the agent; a DLQ has nothing to replay.
    # checkov:skip=CKV_AWS_117: reads S3 over the public endpoint; putting it in
    #   a VPC would require a NAT gateway for no security gain here.
    # checkov:skip=CKV_AWS_173: its only environment variables are two bucket
    #   names - no secrets to encrypt.
    Properties:
      FunctionName: !Sub "${ProjectName}-tools"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      # A workshop account runs one agent; capping concurrency bounds both the
      # blast radius of a runaway loop and the cost of one.
      ReservedConcurrentExecutions: 10
      Role: !GetAtt ToolsFunctionRole.Arn
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          AUDIT_BUCKET: !Ref AuditBucket
      Code:
        # Placeholder. The Provisioner injects the real code from ToolsCodePath.
        ZipFile: |
          def handler(event, context):
              return {"error": "tools not yet provisioned"}

  GatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ToolsFunction
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      # Only an AgentCore Gateway in THIS account may invoke the tools. Without
      # this, any AgentCore gateway in any account could (confused deputy).
      SourceAccount: !Ref AWS::AccountId

  # --- Gateway setup Lambda (backs the GatewaySetup custom resource) ---------
  GatewaySetupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-gwsetup-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: gateway-setup
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CreateUserPool has no resource to scope to (the pool does not
              # exist yet), so this is pinned to the stack's own region instead.
              - Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DescribeUserPool
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # The calls this role actually makes, rather than
              # bedrock-agentcore:* - the resource was already scoped to this
              # account and region, but the action breadth was not, and this role
              # has no business creating runtimes or memories.
              #
              # The workload-identity actions are not called by our code: CreateGateway
              # returns success and then provisions the gateway's dependencies
              # asynchronously AS THE CALLER, so without them the gateway reaches
              # status FAILED a couple of seconds later with
              #   Failed to create gateway dependencies: ... not authorized to perform:
              #   bedrock-agentcore:CreateWorkloadIdentity on resource:
              #   arn:...:workload-identity-directory/default
              # and the stack fails with "Gateway entered FAILED". Verified on a live
              # event; do not prune them back.
              - Effect: Allow
                Action:
                  - bedrock-agentcore:CreateGateway
                  - bedrock-agentcore:GetGateway
                  - bedrock-agentcore:DeleteGateway
                  - bedrock-agentcore:CreateGatewayTarget
                  - bedrock-agentcore:ListGatewayTargets
                  - bedrock-agentcore:DeleteGatewayTarget
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:GetWorkloadIdentity
                  - bedrock-agentcore:DeleteWorkloadIdentity
                Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-gateway-role"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-gateway-role"
                Condition:
                  StringEquals:
                    iam:PassedToService: bedrock-agentcore.amazonaws.com
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParamName}*"
              # Turn on CloudWatch Transaction Search once, here, so AgentCore
              # traces are ingested for Part 1's observability section. None of
              # these accept a resource ARN, so they are bounded by region.
              # Doing it here keeps the chain of account-level enablement
              # permissions this needs out of the participant's own policy.
              - Effect: Allow
                Action:
                  - xray:UpdateTraceSegmentDestination
                  - xray:GetTraceSegmentDestination
                  - xray:UpdateIndexingRule
                  - xray:GetIndexingRules
                  - application-signals:StartDiscovery
                  - cloudtrail:CreateServiceLinkedChannel
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - sts:GetCallerIdentity
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              # Enabling Transaction Search also creates and configures the
              # aws/spans log group that the indexed spans land in.
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/application-signals/*"
              # Application Signals creates its own service-linked role the
              # first time Transaction Search is enabled in an account. Scoped to
              # the service-linked role path, so it cannot make anything else.
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - application-signals.cloudwatch.amazonaws.com
                      - xray.amazonaws.com
                      - cloudtrail.amazonaws.com

  GatewaySetupFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_115: a custom resource that runs at most twice in
    #   the stack lifetime does not need reserved concurrency.
    # checkov:skip=CKV_AWS_116: a DLQ adds nothing - a failure surfaces
    #   directly as a CloudFormation resource failure.
    # checkov:skip=CKV_AWS_117: needs the public AWS APIs and the
    #   CloudFormation response endpoint, so it stays out of the VPC.
    Properties:
      FunctionName: !Sub "${ProjectName}-gwsetup"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 600
      MemorySize: 256
      Role: !GetAtt GatewaySetupRole.Arn
      Code:
        # Placeholder. The Provisioner injects the real handler from GatewayCodePath
        # (plus tool_definition.json) before the GatewaySetup resource runs.
        ZipFile: |
          def handler(event, context):
              return {"error": "gateway setup not yet provisioned"}

  # --- Provisioner: seeds data + injects both Lambda code bundles ------------
  ProvisionerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-provisioner-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: provision
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  # The buckets are versioned, so emptying them means listing
                  # and deleting versions, not just current objects.
                  - s3:ListBucketVersions
                  - s3:DeleteObjectVersion
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
                  # Emptied on stack delete so accumulated reports and access
                  # logs cannot block teardown.
                  - !GetAtt AuditBucket.Arn
                  - !Sub "${AuditBucket.Arn}/*"
                  - !GetAtt LogBucket.Arn
                  - !Sub "${LogBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource:
                  - !GetAtt ToolsFunction.Arn
                  - !GetAtt GatewaySetupFunction.Arn

  ProvisionerFunction:
    Type: AWS::Lambda::Function
    # checkov:skip=CKV_AWS_115: a custom resource that runs at most twice in
    #   the stack lifetime does not need reserved concurrency.
    # checkov:skip=CKV_AWS_116: a DLQ adds nothing - a failure surfaces
    #   directly as a CloudFormation resource failure.
    # checkov:skip=CKV_AWS_117: needs the public AWS APIs and the
    #   CloudFormation response endpoint, so it stays out of the VPC.
    Properties:
      FunctionName: !Sub "${ProjectName}-provisioner"
      Description: Seeds datasets to S3 and injects the tools + gateway Lambda code (all embedded, no external source).
      Runtime: python3.12
      Handler: index.handler
      # Writes embedded (gzip+base64) assets to S3 and injects code into two
      # Lambdas, waiting for each (_wait polls up to ~120s each). 900s (Lambda
      # max) gives ample headroom.
      Timeout: 900
      MemorySize: 512
      Role: !GetAtt ProvisionerRole.Arn
      Code:
        ZipFile: |
          import io, json, time, gzip, base64, zipfile, urllib.request, boto3
          s3 = boto3.client("s3"); lam = boto3.client("lambda")

          # Self-contained CloudFormation responder. We do NOT rely on the
          # auto-injected `cfnresponse` module (it is not always present for
          # inline ZipFile functions, which caused ImportModuleError here).
          def _send(event, context, status, data=None, physical_id=None, reason=None):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or f"See CloudWatch log stream: {context.log_stream_name}",
                  "PhysicalResourceId": physical_id or context.log_stream_name,
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "NoEcho": False, "Data": data or {},
              }).encode()
              req = urllib.request.Request(
                  event["ResponseURL"], data=body, method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))})
              # CloudFormation hands us a presigned HTTPS callback URL. Assert the
              # scheme before opening it, so a malformed event cannot turn this into
              # a file:// or custom-scheme fetch.
              if not event["ResponseURL"].startswith("https://"):
                  raise ValueError("ResponseURL is not https")
              urllib.request.urlopen(req, timeout=30)  # nosec B310 - scheme asserted above

          def _wait(fn):
              for _ in range(60):
                  c = lam.get_function(FunctionName=fn)["Configuration"]
                  if c.get("LastUpdateStatus") != "InProgress":
                      return
                  time.sleep(2)

          def _zip(files):
              b = io.BytesIO()
              with zipfile.ZipFile(b, "w", zipfile.ZIP_DEFLATED) as z:
                  for n, data in files.items():
                      z.writestr(n, data)
              return b.getvalue()

          def _un(b64):  # gzip+base64 blob -> raw bytes
              return gzip.decompress(base64.b64decode(b64))

          def handler(event, context):
              rt = event.get("RequestType", "")
              p = event.get("ResourceProperties", {})
              bucket = p["DataBucket"]; tools_fn = p["ToolsFunction"]
              gw_fn = p["GatewayFunction"]
              try:
                  if rt in ("Create", "Update"):
                      # All assets are embedded in the template (gzip+base64) and
                      # passed via ResourceProperties - no external repo or S3 stage.
                      n = 0
                      for name, b64 in p.get("DataFiles", {}).items():
                          s3.put_object(Bucket=bucket, Key="data/" + name,
                                        Body=_un(b64),
                                        ContentType="application/json")
                          n += 1
                      # Everything the participant opens: agent/, canvas/ and
                      # skills/, keyed by path relative to the repo root. The
                      # Code Editor mirrors s3://<bucket>/workspace/ into
                      # /workshop/repo/ at boot, so nothing is cloned.
                      a = 0
                      for rel, b64 in p.get("AgentFiles", {}).items():
                          s3.put_object(Bucket=bucket, Key="workspace/" + rel,
                                        Body=_un(b64))
                          a += 1
                      lam.update_function_code(
                          FunctionName=tools_fn,
                          ZipFile=_zip({"index.py": _un(p["ToolsCodeB64"])}))
                      _wait(tools_fn)
                      lam.update_function_code(
                          FunctionName=gw_fn,
                          ZipFile=_zip({"index.py": _un(p["GatewayCodeB64"]),
                                        "tool_definition.json": _un(p["ToolDefB64"])}))
                      _wait(gw_fn)
                      _send(event, context, "SUCCESS",
                            {"FilesUploaded": str(n),
                             "AgentFilesUploaded": str(a)}, "provisioner")
                  elif rt == "Delete":
                      # Empty every bucket in the stack so none of them blocks
                      # teardown: datasets, published reports, and the S3 server
                      # access logs that accumulate while the event runs.
                      #
                      # All three buckets are versioned, so this has to page over
                      # list_object_versions rather than list_objects_v2 and delete
                      # each VersionId. A plain delete only adds a delete marker:
                      # the bucket still holds the old versions, S3 refuses to
                      # delete a non-empty bucket, and the stack strands in
                      # DELETE_FAILED with the account still leased.
                      pag = s3.get_paginator("list_object_versions"); d = 0
                      for b in [bucket, p.get("AuditBucket"), p.get("LogBucket")]:
                          if not b:
                              continue
                          try:
                              for page in pag.paginate(Bucket=b):
                                  objs = [{"Key": o["Key"], "VersionId": o["VersionId"]}
                                          for o in (page.get("Versions", []) +
                                                    page.get("DeleteMarkers", []))]
                                  # 1000 per call is the API limit and also the
                                  # page size, so a page maps to one request.
                                  if objs:
                                      s3.delete_objects(Bucket=b, Delete={"Objects": objs})
                                      d += len(objs)
                          except Exception as be:
                              # A bucket we cannot empty must not strand the stack.
                              print("could not empty %s: %s" % (b, be))
                      _send(event, context, "SUCCESS",
                            {"FilesDeleted": str(d)}, "provisioner")
                  else:
                      _send(event, context, "SUCCESS", {}, "provisioner")
              except Exception as e:
                  _send(event, context, "FAILED", {"Error": str(e)}, "provisioner",
                        reason=str(e))

  Provisioner:
    Type: Custom::ToolsProvisioner
    DependsOn:
      - DataBucket
      - AuditBucket
      - LogBucket
      - ToolsFunction
      - GatewaySetupFunction
    Properties:
      ServiceToken: !GetAtt ProvisionerFunction.Arn
      DataBucket: !Ref DataBucket
      AuditBucket: !Ref AuditBucket
      LogBucket: !Ref LogBucket
      ToolsFunction: !Ref ToolsFunction
      GatewayFunction: !Ref GatewaySetupFunction
      # ----------------------------------------------------------------------
      # Embedded assets (gzip + base64). GENERATED by infra/bundle_assets.py -
      # do not edit by hand. Re-run that script whenever the tools handler,
      # gateway handler, tool_definition.json, or agent/data/*.json change.
      # ----------------------------------------------------------------------
      ToolsCodeB64: ""
      GatewayCodeB64: ""
      ToolDefB64: ""
      AgentFiles:
        "agent/.env.example": ""
        "agent/agent.py": ""
        "agent/agentcore/.gitignore": ""
        "agent/agentcore/.llm-context/README.md": ""
        "agent/agentcore/.llm-context/agentcore.ts": ""
        "agent/agentcore/.llm-context/aws-targets.ts": ""
        "agent/agentcore/agentcore.json": ""
        "agent/agentcore/aws-targets.json": "H4sIAAAAAAAC/02OwQrCMBBE7/2KIWdb9OoH+AMexUOabJtAuinphlLEfzehVlzYy7wZZh4N8CoPKNYTqSuUpUHnIOq0y5YWk/wsPnKlNx8CWXiGFvQxClYvDuII2piYWaDZItFYAthihk6ElJk9jyXW4U41WDL9Ble9fvj5LM0hbtU5pDhVOSGujEkb55m6Y9S3qg46/92B9/ZK89KSXqS9qELezbP5ALyP0u/xAAAA"
        "agent/agentcore/cdk/.gitignore": "H4sIAAAAAAAC/y2MSQrAIAwA73lFwLv9Q+utjyhiQgm1KiYe+vsu9DbMwDich2TCOqwNAxK1CcBh4MaFuCRhhVKJt7PSyKxfXcKKUZUN1eIuZUeSzslqv8AnOvyv4eVnDTd1glG8ZwAAAA=="
        "agent/agentcore/cdk/.npmignore": "H4sIAAAAAAAC/9PSKynmUtTSSwHRXMoKzi7eConFxaklCsUliemZeekKKZlFqckl+UWVXHrJKdl6UGEuEDu/tIQLAJP2PltBAAAA"
