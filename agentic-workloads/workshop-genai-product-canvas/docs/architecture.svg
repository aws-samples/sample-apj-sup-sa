<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
    <style>
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .lbl { font-size: 14px; font-weight: 600; fill: #12212e; }
      .sub { font-size: 11px; fill: #4a5b6b; }
      .edge { stroke: #5a6b7b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edgelbl { font-size: 11px; fill: #33475b; }
      .zone { fill: none; stroke: #b9c6d2; stroke-width: 1.5; stroke-dasharray: 6 4; rx: 14; ry: 14; }
      .zonelbl { font-size: 12px; font-weight: 700; fill: #7a8a99; letter-spacing: .5px; }
      .title { font-size: 20px; font-weight: 700; fill: #0b1a26; }
    </style>
  </defs>

  <text x="30" y="34" class="title">Biodiversity Anomaly Agent on Amazon Bedrock AgentCore</text>

  <!-- Caller -->
  <rect x="330" y="58" width="240" height="52" class="box" fill="#eef4fb" stroke="#4a90d9"/>
  <text x="450" y="80" text-anchor="middle" class="lbl">Caller</text>
  <text x="450" y="98" text-anchor="middle" class="sub">agentcore invoke / EventBridge schedule</text>

  <!-- AgentCore zone -->
  <rect x="60" y="130" width="780" height="300" class="zone"/>
  <text x="78" y="152" class="zonelbl">AMAZON BEDROCK AGENTCORE</text>

  <!-- Runtime -->
  <rect x="330" y="165" width="240" height="60" class="box" fill="#e7f0e8" stroke="#4f9d5b"/>
  <text x="450" y="189" text-anchor="middle" class="lbl">AgentCore Runtime</text>
  <text x="450" y="208" text-anchor="middle" class="sub">runs agent.py (@app.entrypoint)</text>

  <!-- Model -->
  <rect x="330" y="262" width="240" height="60" class="box" fill="#f3ecfb" stroke="#8a5cd1"/>
  <text x="450" y="286" text-anchor="middle" class="lbl">Bedrock model (Claude Sonnet)</text>
  <text x="450" y="305" text-anchor="middle" class="sub">the reasoning loop</text>

  <!-- Gateway -->
  <rect x="330" y="360" width="240" height="58" class="box" fill="#fdf1e3" stroke="#e08e2b"/>
  <text x="450" y="383" text-anchor="middle" class="lbl">AgentCore Gateway (MCP)</text>
  <text x="450" y="401" text-anchor="middle" class="sub">1 secure endpoint = 6 tools</text>

  <!-- Observability (right side, inside zone) -->
  <rect x="620" y="205" width="190" height="150" class="box" fill="#eaf6f8" stroke="#2ba0b3"/>
  <text x="715" y="234" text-anchor="middle" class="lbl">Observability</text>
  <text x="715" y="256" text-anchor="middle" class="sub">OTEL spans</text>
  <text x="715" y="274" text-anchor="middle" class="sub">token usage</text>
  <text x="715" y="292" text-anchor="middle" class="sub">latency / tool order</text>
  <text x="715" y="316" text-anchor="middle" class="sub">-&gt; CloudWatch</text>
  <text x="715" y="334" text-anchor="middle" class="sub">GenAI dashboards</text>

  <!-- Identity (left side, inside zone) -->
  <rect x="90" y="300" width="180" height="60" class="box" fill="#fbecec" stroke="#d15c5c"/>
  <text x="180" y="324" text-anchor="middle" class="lbl">Identity</text>
  <text x="180" y="342" text-anchor="middle" class="sub">Cognito M2M / JWT</text>

  <!-- Tool Lambda -->
  <rect x="330" y="470" width="240" height="58" class="box" fill="#fdf6df" stroke="#d9b60c"/>
  <text x="450" y="493" text-anchor="middle" class="lbl">Tools Lambda</text>
  <text x="450" y="511" text-anchor="middle" class="sub">6 tools, dispatch on tool name</text>

  <!-- S3 data -->
  <rect x="255" y="565" width="180" height="52" class="box" fill="#e9eef2" stroke="#5a7184"/>
  <text x="345" y="587" text-anchor="middle" class="lbl">S3 datasets</text>
  <text x="345" y="604" text-anchor="middle" class="sub">detections, weather, ...</text>

  <!-- S3 audit -->
  <rect x="465" y="565" width="180" height="52" class="box" fill="#e9eef2" stroke="#5a7184"/>
  <text x="555" y="587" text-anchor="middle" class="lbl">S3 audit</text>
  <text x="555" y="604" text-anchor="middle" class="sub">reports + audit log</text>

  <!-- Edges -->
  <line x1="450" y1="110" x2="450" y2="163" class="edge"/>
  <line x1="450" y1="225" x2="450" y2="260" class="edge"/>
  <text x="458" y="248" class="edgelbl">InvokeModel</text>

  <line x1="450" y1="322" x2="450" y2="358" class="edge"/>
  <text x="458" y="344" class="edgelbl">tool call (MCP + JWT)</text>

  <line x1="450" y1="418" x2="450" y2="468" class="edge"/>
  <text x="458" y="446" class="edgelbl">lambda:InvokeFunction</text>

  <line x1="410" y1="528" x2="360" y2="563" class="edge"/>
  <line x1="490" y1="528" x2="540" y2="563" class="edge"/>

  <!-- Identity to gateway -->
  <line x1="270" y1="336" x2="328" y2="380" class="edge"/>
  <text x="250" y="378" class="edgelbl">validates</text>

  <!-- Runtime/model to observability -->
  <line x1="570" y1="240" x2="618" y2="255" class="edge"/>
  <text x="560" y="228" class="edgelbl">spans</text>

  <!-- return loop hint -->
  <path d="M330,300 C250,300 250,205 328,196" class="edge"/>
  <text x="196" y="250" class="edgelbl">tool result</text>
  <text x="196" y="264" class="edgelbl">(loop)</text>
</svg>
