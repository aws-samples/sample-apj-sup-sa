# OpenTelemetry Collector config for running the sample apps locally. Tested on the
# ADOT Collector v0.50.0 (core v0.158.0) that docker-compose.yml runs. It uses only
# upstream components, so it also runs on the OpenTelemetry Collector Contrib image.
# It receives OTLP from the apps and forwards SigV4-signed requests to the
# CloudWatch OTLP endpoints. This is the "bring your own collector" path in
# https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-OTLPSimplesetup.html
#
# On EC2/ECS/EKS, use the CloudWatch agent instead (`-c default:otel`). It adds
# entity correlation and Container Insights, which this path does not provide.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

extensions:
  sigv4auth/traces:
    region: ${env:AWS_REGION}
    service: xray
  sigv4auth/logs:
    region: ${env:AWS_REGION}
    service: logs
  sigv4auth/metrics:
    region: ${env:AWS_REGION}
    service: monitoring

exporters:
  otlp_http/traces:
    compression: gzip
    traces_endpoint: https://xray.${env:AWS_REGION}.amazonaws.com/v1/traces
    auth:
      authenticator: sigv4auth/traces
  otlp_http/logs:
    compression: gzip
    logs_endpoint: https://logs.${env:AWS_REGION}.amazonaws.com/v1/logs
    headers:
      x-aws-log-group: ${env:SHOP_LOG_GROUP}
      x-aws-log-stream: default
    auth:
      authenticator: sigv4auth/logs
  otlp_http/metrics:
    compression: gzip
    metrics_endpoint: https://monitoring.${env:AWS_REGION}.amazonaws.com/v1/metrics
    auth:
      authenticator: sigv4auth/metrics
  debug:
    verbosity: basic

service:
  extensions: [sigv4auth/traces, sigv4auth/logs, sigv4auth/metrics]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/metrics]
