# ASH v3 configuration for this repository.
project_name: opencode-agentcore-gateway
fail_on_findings: true
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: terraform/.terraform/**
      reason: Terraform provider binaries downloaded by `terraform init`; not part of the repository (gitignored)
    - path: lambda/dashboard_ui/assets/**
      reason: Minified build output of dashboard/ui-src (scanned as source); regenerated by `make -C dashboard/ui-src build`
    - path: "**/node_modules/**"
      reason: Third-party packages; dependencies are checked by npm-audit and grype on the lockfile
