[project]
name = "voice-analytics-agent"
version = "0.1.0"
description = "Voice analytics agent — Pipecat + Deepgram + AgentCore"
requires-python = ">=3.12"
dependencies = [
    # 'webrtc' = SmallWebRTCTransport (aiortc) for AgentCore-hosted voice; 'daily' kept
    # for the pipecat-cloud (PCC) fallback mode.
    "pipecat-ai[daily,deepgram,aws,runner,sagemaker,silero,webrtc]==1.14.0",
    "pipecatcloud==1.4.0",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",  # pipecat pulls pillow in; 12.x has open critical advisories
    "boto3==1.43.117",
    "aiohttp==3.14.5",  # direct dep: JWT-native bearer HTTPS invoke of AgentCore Runtime
    "bedrock-agentcore==1.25.0",  # BedrockAgentCoreApp: voice runs as its own AgentCore Runtime
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
