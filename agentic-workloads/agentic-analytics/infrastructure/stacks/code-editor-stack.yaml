AWSTemplateFormatVersion: '2010-09-09'
Description: 'Code Editor (VS Code) EC2 instance for workshop mode'

Parameters:
  EnvironmentName:
    Type: String
    Default: agentic-analytics

  VpcId:
    Type: String
    Description: VPC ID

  PublicSubnetId:
    Type: String
    Description: Public subnet ID for EC2

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: VPC CIDR for security group rules

  VPCEndpointSecurityGroupId:
    Type: String
    Description: VPC Endpoint Security Group ID (for EC2 to access AWS APIs via VPC endpoints)

  AuroraSecurityGroupId:
    Type: String
    Description: Aurora Security Group ID (for EC2 to access Aurora directly)

  DatabaseSecretArn:
    Type: String
    Description: Database secret ARN

  AuroraEndpoint:
    Type: String
    Description: Aurora cluster endpoint

  DatabaseName:
    Type: String
    Default: timely_unicorn

  ArtifactsBucket:
    Type: String
    Description: S3 bucket with deployment artifacts

  ArtifactsPrefix:
    Type: String
    Default: ''
    Description: S3 key prefix for artifacts

  KnowledgeBaseId:
    Type: String
    Default: ''
    Description: Bedrock Knowledge Base ID

  GlueDatabaseName:
    Type: String
    Default: ''
    Description: Glue database name

  CognitoUserPoolId:
    Type: String
    Default: ''
    Description: Cognito User Pool ID

  LambdaSecurityGroupId:
    Type: String
    Default: ''
    Description: Lambda Security Group ID (for VPC config)

  PrivateSubnet1Id:
    Type: String
    Default: ''
    Description: Private Subnet 1 ID

  PrivateSubnet2Id:
    Type: String
    Default: ''
    Description: Private Subnet 2 ID

  CognitoUserLoginClientId:
    Type: String
    Default: ''
    Description: Cognito App Client ID for user login (Authorization Code flow)

  CognitoDomain:
    Type: String
    Default: ''
    Description: Cognito Hosted UI domain (e.g. myapp-123456.auth.us-east-1.amazoncognito.com)
  AppDatabaseSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for app_user DB credentials (non-owner role for RLS)

  InstanceType:
    Type: String
    # Graviton (arm64) by default: m8g.xlarge has by far the widest capacity
    # footprint in us-east-1 (all AZs, ~10x the free pool of c6i.xlarge), which
    # avoids the "insufficient <type> capacity in <AZ>" launch failures we hit on
    # real fresh-account events. The AMI below and the AWS CLI download in UserData
    # resolve arm64 to match. If you change this to an x86 type, also flip the AMI
    # SSM path (…-arm64 -> …-x86_64) — the UserData CLI download auto-detects arch.
    Default: m8g.xlarge
    AllowedValues:
      - m8g.large
      - m8g.xlarge
      - m8g.2xlarge
      - m7g.xlarge
      - c8g.xlarge
      - c7g.xlarge

  VolumeSize:
    Type: Number
    Default: 50
    MinValue: 30
    MaxValue: 200

  CodeEditorUser:
    Type: String
    Default: participant

  HomeFolder:
    Type: String
    Default: /workshop

  RepoUrl:
    Type: String
    Default: ''
    Description: Git repo URL (optional - if empty, downloads from S3 artifacts bucket)

Mappings:
  # Managed prefix list com.amazonaws.global.cloudfront.origin-facing, per Region.
  CloudFrontOriginFacing:
    us-east-1:
      PrefixListId: pl-3b927c52
    us-west-2:
      PrefixListId: pl-82a045eb

Resources:
  #============================================================================
  # Code Editor Password Secret
  #============================================================================
  CodeEditorSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: Encrypted with the AWS managed key for Secrets Manager; a customer managed key adds cost and no control in a single-account sample.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub ${EnvironmentName}-code-editor-${AWS::StackName}
      Description: Code Editor credentials
      GenerateSecretString:
        PasswordLength: 16
        SecretStringTemplate: !Sub '{"username":"${CodeEditorUser}"}'
        GenerateStringKey: password
        ExcludePunctuation: true

  #============================================================================
  # Security Group
  #============================================================================
  CodeEditorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Code Editor EC2 security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Only CloudFront's origin-facing addresses can reach the instance, so the
        # IDE is not exposed to the internet directly. CloudFront terminates TLS for
        # the browser; the CloudFront-to-instance hop is HTTP inside AWS's network.
        # For production, front the instance with an ALB (HTTPS origin) or a VPC origin.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [CloudFrontOriginFacing, !Ref AWS::Region, PrefixListId]
          Description: HTTP from CloudFront only (origin-facing managed prefix list)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for AWS APIs
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for package downloads
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCIDR
          Description: PostgreSQL to Aurora
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          CidrIp: !Ref VpcCIDR
          Description: Cube Core API on EC2 (port 4000)
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-code-editor-sg

  # Allow EC2 to access VPC endpoints (Secrets Manager, etc.)
  VPCEndpointIngressRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VPCEndpointSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref CodeEditorSecurityGroup

  # Allow EC2 to access Aurora PostgreSQL directly (for local agent testing)
  AuroraIngressFromCodeEditor:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref CodeEditorSecurityGroup
      Description: Allow Code Editor EC2 to access Aurora

  #============================================================================
  # IAM Role - Workshop Permissions
  #============================================================================
  CodeEditorRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F3
            reason: >-
              Workshop participants deploy CloudFormation stacks (Lambda, IAM roles, AgentCore,
              Glue, EC2) from this Code Editor instance, so the role needs service-wide actions.
              It exists only in a single-use Workshop Studio sandbox account.
          - id: F38
            reason: >-
              The stacks participants deploy create their own roles with generated names and
              pass them to Lambda, AgentCore and Glue, so PassRole cannot be scoped to known ARNs.
      checkov:
        skip:
          - id: CKV_AWS_107
            comment: 'Participant''s workshop role: deploys every stack from Code Editor in a single-use Workshop Studio account.'
          - id: CKV_AWS_108
            comment: 'Participant''s workshop role: deploys every stack from Code Editor in a single-use Workshop Studio account.'
          - id: CKV_AWS_110
            comment: 'Participant''s workshop role: creates the roles of the stacks they deploy.'
          - id: CKV_AWS_109
            comment: Workshop sandbox deployment role, see cfn_nag reason.
          - id: CKV_AWS_111
            comment: Workshop sandbox deployment role, see cfn_nag reason.
    Properties:
      RoleName: !Sub ${EnvironmentName}-code-editor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: WorkshopPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # SANDBOX ONLY. This role lets a workshop participant deploy every lab
              # stack from Code Editor in a single-use Workshop Studio account, so
              # several services keep service-wide actions. Do not reuse it outside a
              # disposable account; narrow each grant to the actions and ARNs you use.

              # The role cannot change its own permissions or instance profile.
              - Effect: Deny
                Action: iam:*
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${EnvironmentName}-code-editor-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/*-CodeEditorInstanceProfile-*

              # Secrets Manager: read this account's secrets (Aurora, Cube), write only
              # the workshop's own.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvironmentName}-*

              # RDS Data API: Step 11 runs DDL on the workshop's Aurora cluster.
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${EnvironmentName}-*

              # S3: read any bucket (the event assets bucket is not ours); write only
              # the workshop's buckets (<env>-*) and the bedrock-agentcore-* staging bucket below.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${EnvironmentName}-*/*

              # Bedrock: models and inference profiles, and this account's guardrails and
              # knowledge bases (the console steps edit the managed KB). Read calls take no ARN.
              - Effect: Allow
                Action: bedrock:*
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:*
              - Effect: Allow
                Action:
                  - bedrock:List*
                  - bedrock:Get*
                  - bedrock:PutUseCaseForModelAccess
                  - bedrock:CreateFoundationModelAgreement
                Resource: '*'

              # AWS Marketplace - Bedrock model subscription verification
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: '*'

              # Glue: this account's catalog, databases, tables and crawlers.
              - Effect: Allow
                Action: glue:*
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:*

              # Lambda: the workshop's functions and layers (<env>-*, plus the Cube
              # lab's semantic-layer-*); read-only everywhere else.
              - Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${EnvironmentName}-*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:semantic-layer-*
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${EnvironmentName}-*
              - Effect: Allow
                Action:
                  - lambda:Get*
                  - lambda:List*
                Resource: '*'

              # IAM - participants' stacks create their own roles. Every role the
              # workshop creates is named ${EnvironmentName}-* (CloudFormation
              # auto-names start with the stack name, which also starts with it),
              # plus the Cube lab's semantic-layer-* role and the AgentCore starter
              # toolkit's AmazonBedrockAgentCoreSDK* roles. Nothing else is writable.
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRoleDescription
                  - iam:PutRolePermissionsBoundary
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreatePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicy
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                  - iam:UntagPolicy
                  - iam:SetDefaultPolicyVersion
                  - iam:TagInstanceProfile
                  - iam:UntagInstanceProfile
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${EnvironmentName}-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/semantic-layer-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/AmazonBedrockAgentCoreSDK*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/service-role/AmazonBedrockAgentCoreSDK*
                  - !Sub arn:aws:iam::${AWS::AccountId}:policy/${EnvironmentName}-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:instance-profile/${EnvironmentName}-*
              # Roles are passed only to the services the lab stacks use.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${EnvironmentName}-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/semantic-layer-*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/AmazonBedrockAgentCoreSDK*
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/service-role/AmazonBedrockAgentCoreSDK*
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - lambda.amazonaws.com
                      - bedrock-agentcore.amazonaws.com
                      - bedrock.amazonaws.com
                      - glue.amazonaws.com
                      - codebuild.amazonaws.com
                      - states.amazonaws.com
                      - events.amazonaws.com
                      - amplify.amazonaws.com
                      - apigateway.amazonaws.com
              # Blocks attaching the AWS admin-level managed policies to lab roles. It does
              # not stop broad inline or customer managed policies, and created roles need no
              # permissions boundary, so this role can reach admin-equivalent access. That is
              # acceptable only because the Workshop Studio participant already has
              # AdministratorAccess in this single-use account. Outside such an account, add
              # a required permissions boundary on iam:CreateRole and the policy-writing actions.
              - Effect: Deny
                Action: iam:AttachRolePolicy
                Resource: '*'
                Condition:
                  ArnLike:
                    iam:PolicyARN:
                      - arn:aws:iam::aws:policy/AdministratorAccess
                      - arn:aws:iam::aws:policy/PowerUserAccess
                      - arn:aws:iam::aws:policy/IAMFullAccess
              - Effect: Allow
                Action:
                  - iam:Get*
                  - iam:List*
                Resource: '*'
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*

              # EC2 - the only network resources participants create are the voice
              # stack's two subnets and one security group (Step 5). Reads stay on
              # '*'; writes are limited to this account and Region, and changes to an
              # existing subnet or security group only to ones the voice stack owns,
              # so the base VPC, Aurora and endpoint security groups are out of reach.
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:Get*
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateSubnet
                  - ec2:CreateSecurityGroup
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:vpc/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringEquals:
                    ec2:CreateAction:
                      - CreateSubnet
                      - CreateSecurityGroup
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:DeleteSubnet
                  - ec2:ModifySubnetAttribute
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
                Condition:
                  StringLike:
                    ec2:ResourceTag/aws:cloudformation:stack-name: agentic-analytics-voice*
              # The voice subnets join the base private route table; that table
              # carries the base stack's tags, so the association is allowed on it
              # here and the subnet side is checked by the statement above.
              - Effect: Allow
                Action:
                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:route-table/*

              # WAF for the Step 7c front door: the web ACL is named <env>-frontdoor and
              # uses AWS managed rule groups, which CreateWebACL/UpdateWebACL also
              # authorize against the managed rule set ARNs.
              - Effect: Allow
                Action:
                  - wafv2:CreateWebACL
                  - wafv2:UpdateWebACL
                  - wafv2:DeleteWebACL
                  - wafv2:GetWebACL
                  - wafv2:AssociateWebACL
                  - wafv2:DisassociateWebACL
                  - wafv2:TagResource
                  - wafv2:UntagResource
                  - wafv2:ListTagsForResource
                Resource:
                  - !Sub arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/webacl/${EnvironmentName}-frontdoor/*
                  - !Sub arn:aws:wafv2:${AWS::Region}:${AWS::AccountId}:regional/managedruleset/*/*
              - Effect: Allow
                Action:
                  - wafv2:ListWebACLs
                  - wafv2:GetWebACLForResource
                Resource: '*'

              # AgentCore: resources in this account and Region; List calls take no ARN.
              - Effect: Allow
                Action: bedrock-agentcore:*
                Resource: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action:
                  - bedrock-agentcore:List*
                Resource: '*'

              # Voice lab (optional) - the voice stack creates an API Gateway
              # HTTP API (the JWT signaling proxy) and uses Kinesis Video Streams
              # managed WebRTC TURN for media. Without apigateway + kinesisvideo,
              # `make voice-deploy` rolls back with AccessDenied on apigateway:POST
              # (SignalingHttpApi) and on the KVS signaling channel.
              - Effect: Allow
                Action: apigateway:*
                Resource: !Sub arn:aws:apigateway:${AWS::Region}::/*
              - Effect: Allow
                Action: execute-api:*
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action: kinesisvideo:*
                Resource: !Sub arn:aws:kinesisvideo:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action:
                  - kinesisvideo:List*
                  - kinesisvideo:Describe*
                Resource: '*'

              # Cognito: this account's user pools (app clients, users, domains).
              - Effect: Allow
                Action: cognito-idp:*
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              - Effect: Allow
                Action:
                  - cognito-idp:ListUserPools
                  - cognito-idp:DescribeUserPoolDomain
                Resource: '*'

              # CloudFormation - Read stack outputs for auto-detection (any stack)
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:ListStackResources
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  # Step 11.2 reads the Aurora cluster and secret ARNs from the exports.
                  - cloudformation:ListExports
                Resource: '*'
              # CloudFormation - participants deploy the AgentCore top-up + voice
              # stacks via `make deploy` / `make voice-deploy` (aws cloudformation
              # deploy = create/update via change sets). Scoped to the workshop's
              # own stacks. Without this, make deploy fails with
              # AccessDenied: cloudformation:CreateChangeSet.
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/agentic-analytics-agentcore/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/agentic-analytics-voice/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/awscli-cloudformation-package-deploy-*

              # Amplify: apps in this account and Region; CreateApp/ListApps take no ARN.
              - Effect: Allow
                Action: amplify:*
                Resource: !Sub arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/*
              - Effect: Allow
                Action:
                  - amplify:CreateApp
                  - amplify:ListApps
                Resource: '*'

              # SSM: the workshop's parameters (/<env>/...), public AMI parameters that
              # CloudFormation resolves, and Run Command on this account's instances
              # (Cube lab model sync). Session Manager comes from AmazonSSMManagedInstanceCore.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  # CloudFormation reads parameter tags when the top-up stack updates one.
                  - ssm:ListTagsForResource
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/*
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}::parameter/aws/service/*
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeParameters
                Resource: '*'

              # ECR: the agent and voice repositories (<env>-*) and the AgentCore
              # toolkit's bedrock-agentcore-* repositories.
              - Effect: Allow
                Action: ecr:*
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EnvironmentName}-*
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock-agentcore-*
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:DescribeRepositories
                Resource: '*'

              # CodeBuild: the agent and voice image builds.
              - Effect: Allow
                Action: codebuild:*
                Resource:
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${EnvironmentName}-*
                  - !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/bedrock-agentcore-*
              - Effect: Allow
                Action:
                  - codebuild:ListProjects
                  - codebuild:ListBuilds
                Resource: '*'

              # STS: scripts and the Makefile look up the account id.
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

              # CloudWatch Logs: this account's log groups and deliveries; Describe calls take no ARN.
              - Effect: Allow
                Action: logs:*
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action:
                  - logs:Describe*
                  - logs:StartQuery
                  - logs:GetQueryResults
                Resource: '*'

              # X-Ray (for traces delivery configuration)
              - Effect: Allow
                Action:
                  - xray:GetTraceSummaries
                  - xray:BatchGetTraces
                  - xray:GetTraceGraph
                  - xray:GetServiceGraph
                  - xray:GetTraceSegmentDestination
                  - xray:UpdateTraceSegmentDestination
                  - xray:GetIndexingRules
                  - xray:UpdateIndexingRule
                  - xray:ListResourcePolicies
                  - xray:PutResourcePolicy
                Resource: '*'

              # Step 11 schema change pipeline: `make deploy` creates the state machine and
              # the crawler-succeeded rule; `make schema-sync` / `make approve` drive it.
              - Effect: Allow
                Action: states:*
                Resource:
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:*
                  - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:*
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:SendTaskHeartbeat
                  - states:ListStateMachines
                Resource: '*'
              - Effect: Allow
                Action: events:*
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*

              # S3 - CodeBuild source bucket for AgentCore Runtime builds
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::bedrock-agentcore-*
                  - arn:aws:s3:::bedrock-agentcore-*/*


  CodeEditorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CodeEditorRole

  #============================================================================
  # EC2 Instance
  #============================================================================
  CodeEditorInstance:
    Type: AWS::EC2::Instance
    Properties:
      # arm64 AMI to match the Graviton InstanceType default (m8g). If you switch
      # InstanceType to an x86 family, change arm64 -> x86_64 here.
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref CodeEditorInstanceProfile
      # Private subnet: the instance has no public address. CloudFront reaches it
      # through a VPC origin; package installs go out through the NAT gateway.
      SubnetId: !GetAtt OriginSubnet.SubnetId
      SecurityGroupIds:
        - !Ref CodeEditorSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-code-editor
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log) 2>&1

          echo "=== Starting Code Editor Bootstrap ==="

          # Variables
          CODE_EDITOR_USER="${CodeEditorUser}"
          HOME_FOLDER="${HomeFolder}"
          AWS_REGION="${AWS::Region}"

          # Get password from Secrets Manager
          CODE_EDITOR_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id ${CodeEditorSecret} \
            --query 'SecretString' --output text | jq -r '.password')

          # Install packages (skip curl - curl-minimal is pre-installed on AL2023)
          dnf update -y -q
          dnf install -y -q unzip nginx jq git wget python3.11 python3.11-pip nodejs22 nodejs22-npm gcc make postgresql16
          node --version && npm --version   # nodejs22 is the active Node.js via alternatives

          # AWS CLI v2 (arch-detected so this works on both arm64 and x86_64)
          cd /tmp
          CLI_ARCH=$(uname -m)  # aarch64 on Graviton, x86_64 on Intel/AMD
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${!CLI_ARCH}.zip" -o awscliv2.zip
          unzip -q awscliv2.zip && ./aws/install --update && rm -rf awscliv2.zip aws/

          # Create user
          if ! id "$CODE_EDITOR_USER" &>/dev/null; then
            adduser -c '' "$CODE_EDITOR_USER"
            echo "$CODE_EDITOR_USER:$CODE_EDITOR_PASSWORD" | chpasswd
            usermod -aG wheel "$CODE_EDITOR_USER"
          fi

          # Create workspace and clone repo
          mkdir -p "$HOME_FOLDER"
          cd "$HOME_FOLDER"
          
          # Download repo from S3 (packaged during deployment) or clone from Git
          REPO_URL="${RepoUrl}"
          ARTIFACTS_BUCKET="${ArtifactsBucket}"
          ARTIFACTS_PREFIX="${ArtifactsPrefix}"
          if [ -z "$REPO_URL" ]; then
              echo "Downloading repo from S3..."
              aws s3 cp "s3://$ARTIFACTS_BUCKET/${!ARTIFACTS_PREFIX}repo/agentic-analytics.zip" "$HOME_FOLDER/repo.zip"
              unzip -q "$HOME_FOLDER/repo.zip" -d "$HOME_FOLDER/agentic-analytics"
              rm "$HOME_FOLDER/repo.zip"
          else
              echo "Cloning repo from $REPO_URL..."
              git clone "$REPO_URL" agentic-analytics || true
          fi
          chown -R "$CODE_EDITOR_USER:$CODE_EDITOR_USER" "$HOME_FOLDER"

          # Create environment config
          cat > "$HOME_FOLDER/agentic-analytics/app/agentcore_strands/config.env" << ENVEOF
          AWS_REGION=${AWS::Region}
          AWS_DEFAULT_REGION=${AWS::Region}
          AURORA_ENDPOINT=${AuroraEndpoint}
          AURORA_SECRET_ARN=${DatabaseSecretArn}
          # ^ postgres secret — used by the local Step-1 exercise. RLS for the
          #   DEPLOYED agent is a runtime SSM flag (/<env>/rls-mode), flipped in
          #   Step 7.2 — not here.
          DATABASE_NAME=${DatabaseName}
          KNOWLEDGE_BASE_ID=${KnowledgeBaseId}
          GLUE_DATABASE=${GlueDatabaseName}
          COGNITO_USER_POOL_ID=${CognitoUserPoolId}
          VPC_ID=${VpcId}
          SECURITY_GROUP_ID=${LambdaSecurityGroupId}
          SUBNET_IDS=${PrivateSubnet1Id},${PrivateSubnet2Id}
          COGNITO_USER_LOGIN_CLIENT_ID=${CognitoUserLoginClientId}
          COGNITO_DOMAIN=${CognitoDomain}
          ARTIFACTS_BUCKET=${ArtifactsBucket}
          ARTIFACTS_PREFIX=${ArtifactsPrefix}
          ENVEOF
          chown "$CODE_EDITOR_USER:$CODE_EDITOR_USER" "$HOME_FOLDER/agentic-analytics/app/agentcore_strands/config.env"

          # Install Code Editor
          export CodeEditorUser="$CODE_EDITOR_USER"
          curl -fsSL https://code-editor.amazonaws.com/content/code-editor-server/dist/aws-workshop-studio/install.sh | bash -s --

          CODE_EDITOR_CMD="/home/$CODE_EDITOR_USER/.local/bin/code-editor-server"

          # Configure token
          sudo -u "$CODE_EDITOR_USER" mkdir -p "/home/$CODE_EDITOR_USER/.code-editor-server/data"
          echo -n "$CODE_EDITOR_PASSWORD" > "/home/$CODE_EDITOR_USER/.code-editor-server/data/token"
          chown "$CODE_EDITOR_USER:$CODE_EDITOR_USER" "/home/$CODE_EDITOR_USER/.code-editor-server/data/token"
          chmod 600 "/home/$CODE_EDITOR_USER/.code-editor-server/data/token"

          # Nginx config (Code Editor + React UI proxies, unchanged).
          cat > /etc/nginx/conf.d/code-editor.conf << 'NGINXEOF'
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:8080/;
                  proxy_set_header Host $http_host;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection upgrade;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_read_timeout 86400;
              }
              # React UI dev server proxy — keeps /app prefix (Vite dev server base is /app/)
              location /app {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_set_header Host localhost;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection upgrade;
                  proxy_read_timeout 86400;
              }
              # Redirect /ports/3001/ to /app for Code Editor Ports panel
              location /ports/3001/ {
                  return 301 /app;
              }
              # Cube Playground (optional semantic-layer lab). The Ports panel opens it at
              # /ports/4000/, but the Playground loads its assets and calls its API from
              # absolute root paths, which would otherwise hit the Code Editor and 404.
              # Route those paths to the Cube tunnel, only for a signed-in Code Editor
              # session: auth_request asks the Code Editor's own (authenticated) port proxy.
              location ~ ^/(assets/|fonts/|antd\.min\.css|favicon-|playground/|cubejs-api/|cubejs-system/) {
                  auth_request /_code_editor_session;
                  proxy_pass http://127.0.0.1:4000;
                  proxy_set_header Host localhost;
                  proxy_read_timeout 300;
              }
              location = /_code_editor_session {
                  internal;
                  proxy_pass http://127.0.0.1:8080/ports/4000/favicon-16x16.png;
                  proxy_pass_request_body off;
                  proxy_set_header Content-Length "";
                  proxy_set_header Host $http_host;
              }
          }
          NGINXEOF
          # Disable default server block that conflicts with our conf.d config
          sed -i '/^    server {/,/^    }/s/^/#/' /etc/nginx/nginx.conf
          nginx -t && systemctl enable nginx && systemctl start nginx

          # --- Cube Playground access (private EC2) ---
          # The Cube Playground SPA serves assets from absolute "/" paths, so it cannot
          # be reverse-proxied under a subpath. Instead we run a TCP forwarder so
          # localhost:4000 on this box transparently maps to the private Cube:4000 — the
          # code-server "Ports" panel then exposes :4000 to the participant's browser at
          # ROOT, where the SPA (and its websocket) works correctly.
          #   * cube-resolve.sh writes the discovered Cube IP into /etc/cube-tunnel.env
          #   * cube-tunnel.service runs socat in the FOREGROUND (long-lived; not a
          #     backgrounded child of a oneshot, which systemd would reap)
          #   * a timer re-resolves until Cube (which deploys after this box) appears
          dnf install -y -q socat || true
          # cube-resolve.sh is delivered base64-encoded so Fn::Sub never parses its
          # bash syntax. It looks up the Cube instance by Name tag, writes CUBE_IP into
          # /etc/cube-tunnel.env, and restarts cube-tunnel.service.
          CUBE_RESOLVE_B64=''
          echo "$CUBE_RESOLVE_B64" | base64 -d > /usr/local/bin/cube-resolve.sh
          chmod +x /usr/local/bin/cube-resolve.sh
          echo "CUBE_IP=127.0.0.1" > /etc/cube-tunnel.env
          # Long-lived socat tunnel: localhost:4000 -> Cube:4000 (reads CUBE_IP from env file)
          cat > /etc/systemd/system/cube-tunnel.service << 'TUNEOF'
          [Unit]
          Description=TCP tunnel localhost:4000 -> private Cube EC2:4000 (for code-server Ports panel)
          After=network-online.target
          [Service]
          EnvironmentFile=/etc/cube-tunnel.env
          ExecStart=/usr/bin/socat TCP-LISTEN:4000,fork,reuseaddr TCP:${!CUBE_IP}:4000
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          TUNEOF
          # Resolver service + timer (re-resolve until Cube appears, then keep fresh)
          cat > /etc/systemd/system/cube-resolve.service << SVCEOF
          [Unit]
          Description=Resolve private Cube IP and (re)point the cube-tunnel
          After=network-online.target
          [Service]
          Type=oneshot
          Environment=CUBE_REGION=${AWS::Region}
          Environment=CUBE_ENVNAME=${EnvironmentName}
          ExecStart=/usr/local/bin/cube-resolve.sh
          SVCEOF
          cat > /etc/systemd/system/cube-resolve.timer << 'TMREOF'
          [Unit]
          Description=Re-resolve Cube IP every 2 min until it is up
          [Timer]
          OnBootSec=45
          OnUnitActiveSec=120
          [Install]
          WantedBy=timers.target
          TMREOF
          systemctl daemon-reload
          systemctl enable cube-tunnel.service
          systemctl enable --now cube-resolve.timer
          systemctl start cube-resolve.service || true

          # Code Editor systemd service (use explicit user, not %i template)
          cat > /etc/systemd/system/code-editor.service << SVCEOF
          [Unit]
          Description=Code Editor Server
          After=network.target
          [Service]
          Type=simple
          User=$CODE_EDITOR_USER
          Environment=AWS_REGION=$AWS_REGION
          Environment=AWS_DEFAULT_REGION=$AWS_REGION
          ExecStart=$CODE_EDITOR_CMD --accept-server-license-terms --host 127.0.0.1 --port 8080 --default-workspace $HOME_FOLDER/agentic-analytics --default-folder $HOME_FOLDER/agentic-analytics --connection-token $CODE_EDITOR_PASSWORD
          Restart=always
          [Install]
          WantedBy=multi-user.target
          SVCEOF

          systemctl daemon-reload
          systemctl enable code-editor
          systemctl start code-editor

          # Install VS Code extensions (Python only — Amazon Q is intentionally NOT
          # installed; this workshop uses Claude Code on Amazon Bedrock instead).
          sleep 10
          sudo -u "$CODE_EDITOR_USER" "$CODE_EDITOR_CMD" --install-extension ms-python.python --force || true

          # --- Claude Code CLI on Amazon Bedrock -------------------------------
          # Install the CLI globally (nodejs is installed above) and configure it to
          # use Bedrock via the EC2 instance role (no API key). The instance role
          # already grants bedrock:* + aws-marketplace:Subscribe/ViewSubscriptions.
          # Model is pinned to the Global Sonnet 5.5 inference profile, whose
          # Marketplace agreement is already AVAILABLE in fresh Workshop Studio
          # accounts (verified 2026-10-23). Use global.* IDs: us.* Haiku 5.5 is
          # denied by the sandbox's private marketplace. Claude Code uses the
          # default AWS SDK credential chain, so the instance role is picked up
          # automatically.
          npm install -g @anthropic-ai/claude-code@2.1.309 2>&1 || echo "claude-code install failed (non-fatal)"
          cat >> "/home/$CODE_EDITOR_USER/.bashrc" << CLAUDEEOF
          # Claude Code -> Amazon Bedrock (instance-role auth, no API key)
          export CLAUDE_CODE_USE_BEDROCK=1
          export ANTHROPIC_MODEL='global.anthropic.claude-sonnet-5-5'
          export ANTHROPIC_DEFAULT_SONNET_MODEL='global.anthropic.claude-sonnet-5-5'
          CLAUDEEOF

          # Python venv setup
          sudo -u "$CODE_EDITOR_USER" python3.11 -m pip install --user pip==26.2.2
          cd "$HOME_FOLDER/agentic-analytics/app/agentcore_strands"
          sudo -u "$CODE_EDITOR_USER" python3.11 -m venv "$HOME_FOLDER/.venv"
          sudo -u "$CODE_EDITOR_USER" "$HOME_FOLDER/.venv/bin/pip" install -r requirements.txt || true

          # Bashrc shortcuts
          cat >> "/home/$CODE_EDITOR_USER/.bashrc" << 'BASHEOF'
          export AWS_REGION="${AWS::Region}"
          export AWS_DEFAULT_REGION="${AWS::Region}"
          alias workshop='cd /workshop/agentic-analytics'
          alias activate='source /workshop/.venv/bin/activate'
          source /workshop/.venv/bin/activate
          BASHEOF

          echo "=== Code Editor Bootstrap Complete ==="

  #============================================================================
  # CloudFront Cache Policy
  #============================================================================
  CloudFrontCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${EnvironmentName}-code-editor-cache
        DefaultTTL: 0
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept-Charset
              - Authorization
              - Origin
              - Accept
              - Referer
              - Host
              - Accept-Language
              - Accept-Encoding
          QueryStringsConfig:
            QueryStringBehavior: all

  #============================================================================
  # Private subnet for the instance. CloudFront VPC origins do not run in
  # us-east-1 AZ use1-az3, so pick the first private subnet outside it.
  #============================================================================
  OriginSubnetPickerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeSubnets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeSubnets
                Resource: '*'

  OriginSubnetPickerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt OriginSubnetPickerRole.Arn
      Code:
        ZipFile: |
          # cfnresponse is not importable in this runtime, so reply to CloudFormation directly.
          import boto3, json, urllib.request
          UNSUPPORTED = {"use1-az3", "usw1-az2", "apne1-az3", "cac1-az3"}
          def send(event, context, status, data, physical_id=None, reason="OK"):
              body = json.dumps({"Status": status, "Reason": reason, "PhysicalResourceId": physical_id or event.get("PhysicalResourceId") or context.log_stream_name, "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "Data": data})
              urllib.request.urlopen(urllib.request.Request(event["ResponseURL"], data=body.encode(), headers={"Content-Type": ""}, method="PUT"))
          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      return send(event, context, "SUCCESS", {})
                  ids = [i for i in event["ResourceProperties"]["SubnetIds"] if i]
                  subnets = boto3.client("ec2").describe_subnets(SubnetIds=ids)["Subnets"]
                  by_id = {s["SubnetId"]: s for s in subnets}
                  pick = next(i for i in ids if by_id[i]["AvailabilityZoneId"] not in UNSUPPORTED)
                  send(event, context, "SUCCESS", {"SubnetId": pick}, pick)
              except Exception as e:
                  print(f"subnet pick failed: {e}")
                  send(event, context, "FAILED", {}, reason=f"subnet pick failed: {e}"[:250])

  OriginSubnet:
    Type: Custom::OriginSubnet
    Properties:
      ServiceToken: !GetAtt OriginSubnetPickerFunction.Arn
      SubnetIds:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id

  # CloudFront connects to the instance privately, inside the VPC.
  CodeEditorVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub ${EnvironmentName}-code-editor
        Arn: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${CodeEditorInstance}
        HTTPPort: 80
        HTTPSPort: 443
        OriginProtocolPolicy: http-only

  #============================================================================
  # CloudFront Distribution
  #============================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_86
            comment: Workshop IDE distribution; no access-log requirement for a single-use sandbox.
          - id: CKV_AWS_68
            comment: The origin only accepts CloudFront traffic and the IDE is token-gated.
    DependsOn: CodeEditorInstance
    # checkov:skip=CKV_AWS_174: uses the default *.cloudfront.net viewer cert
    #   (already TLS 1.2+); MinimumProtocolVersion only applies with a custom ACM cert.
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: !Ref CloudFrontCachePolicy
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          TargetOriginId: code-editor-origin
          # Force viewers onto HTTPS — the Code Editor URL carries an auth token,
          # so it must never be served over plaintext HTTP. (CKV_AWS_34)
          ViewerProtocolPolicy: redirect-to-https
        Origins:
          - Id: code-editor-origin
            DomainName: !GetAtt CodeEditorInstance.PrivateDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt CodeEditorVpcOrigin.Id
              OriginReadTimeout: 60

  #============================================================================
  # URL Resolver - reads password from Secrets Manager to build clickable URL
  #============================================================================
  UrlResolverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-url-resolver-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref CodeEditorSecret
        - PolicyName: RegisterCognitoCallback
          # Lets the post-CloudFront resolver append the CloudFront /app URL to the
          # Cognito user-pool client's callback/logout lists (fixes redirect_mismatch:
          # the client ships with only localhost callbacks; the live URL isn't known
          # until CloudFront exists).
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}

  UrlResolverFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-url-resolver
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt UrlResolverRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, json, urllib.request
          def send(event, context, status, data={}, reason=''):
              body = json.dumps({'Status': status, 'Reason': reason or 'OK', 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body.encode(), headers={'Content-Type': ''}, method='PUT'))
          def register_cognito_callback(pool_id, client_id, domain):
              # Append https://<cloudfront-domain>/app to the client's callback/logout
              # URLs so the OAuth Authorization Code flow works from the deployed UI.
              # Best-effort: never fail the stack over this (manual add is documented).
              if not (pool_id and client_id and domain):
                  print('skip cognito callback: missing pool/client/domain'); return
              c = boto3.client('cognito-idp')
              try:
                  cur = c.describe_user_pool_client(UserPoolId=pool_id, ClientId=client_id)['UserPoolClient']
              except Exception as e:
                  print(f'describe_user_pool_client failed: {e}'); return
              app_url = f'https://{domain}/app'
              cbs = list(cur.get('CallbackURLs') or []); los = list(cur.get('LogoutURLs') or [])
              changed = False
              for u in (app_url, app_url + '/'):
                  if u not in cbs: cbs.append(u); changed = True
                  if u not in los: los.append(u); changed = True
              if not changed:
                  print('cognito client already allows the CloudFront /app URL'); return
              args = {'UserPoolId': pool_id, 'ClientId': client_id, 'CallbackURLs': cbs, 'LogoutURLs': los}
              # Re-pass fields update_user_pool_client would otherwise CLEAR (notably
              # ExplicitAuthFlows — losing it breaks USER_PASSWORD_AUTH login).
              for f in ('AllowedOAuthFlows','AllowedOAuthScopes','AllowedOAuthFlowsUserPoolClient','SupportedIdentityProviders','ExplicitAuthFlows','ClientName','ReadAttributes','WriteAttributes'):
                  if f in cur: args[f] = cur[f]
              try:
                  c.update_user_pool_client(**args); print(f'added {app_url} to cognito client {client_id}')
              except Exception as e:
                  print(f'update_user_pool_client failed: {e}')
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send(event, context, 'SUCCESS')
                  return
              try:
                  p = event['ResourceProperties']
                  secret = boto3.client('secretsmanager').get_secret_value(SecretId=p['SecretId'])  # checkov:skip=CKV_SECRET_6: false positive — reads a CFN-generated password from Secrets Manager at runtime; no literal secret here
                  password = json.loads(secret['SecretString'])['password']
                  url = f"https://{p['Domain']}/?tkn={password}&folder={p['Folder']}"
                  register_cognito_callback(p.get('CognitoUserPoolId'), p.get('CognitoUserLoginClientId'), p.get('Domain'))
                  send(event, context, 'SUCCESS', {'Url': url})
              except Exception as e:
                  send(event, context, 'FAILED', reason=str(e))

  UrlResolver:
    Type: Custom::UrlResolver
    DependsOn:
      - UrlResolverFunction
      - CloudFrontDistribution
    Properties:
      ServiceToken: !GetAtt UrlResolverFunction.Arn
      SecretId: !Ref CodeEditorSecret
      Domain: !GetAtt CloudFrontDistribution.DomainName
      Folder: !Sub ${HomeFolder}/agentic-analytics
      # Used to register https://<domain>/app as a Cognito callback (redirect_mismatch fix)
      CognitoUserPoolId: !Ref CognitoUserPoolId
      CognitoUserLoginClientId: !Ref CognitoUserLoginClientId

Outputs:
  CodeEditorUrl:
    Description: Code Editor URL (VS Code in browser)
    Value: !GetAtt UrlResolver.Url

  CodeEditorSecretArn:
    Description: Secret ARN containing Code Editor password
    Value: !Ref CodeEditorSecret

  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref CodeEditorInstance

  CloudFrontDomain:
    Description: CloudFront domain
    Value: !GetAtt CloudFrontDistribution.DomainName

  CodeEditorSecurityGroupId:
    Description: Code Editor SG (Cube allows inbound on 4000 from this so the nginx proxy can reach the private Cube)
    Value: !Ref CodeEditorSecurityGroup
