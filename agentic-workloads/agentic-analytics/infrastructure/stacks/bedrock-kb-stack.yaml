AWSTemplateFormatVersion: '2010-09-09'
Description: 'Amazon Bedrock Managed Knowledge Base for business context (managed vector store, embeddings and reranking)'

Parameters:
  EnvironmentName:
    Type: String
    Default: agentic-analytics




  ArtifactsBucket:
    Type: String
    Description: S3 bucket containing business-context.md

  ArtifactsPrefix:
    Type: String
    Default: ''
    Description: S3 key prefix for artifacts

  BusinessContextKey:
    Type: String
    Default: docs/business-context.md

  KnowledgeBaseName:
    Type: String
    Default: agentic-analytics-kb


Resources:
  #============================================================================
  # S3 Bucket for KB Documents (Bedrock needs direct S3 access)
  #============================================================================
  KBDocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      # Region in the name avoids S3 global-endpoint stale-region-cache 301s when the
      # same account previously held this bucket name in another region (e.g. a prior
      # demo in us-west-2). Bedrock ingestion uses the global endpoint and won't follow
      # the 301, so a region-distinct name is required for reliable multi-region reuse.
      BucketName: !Sub ${EnvironmentName}-kb-docs-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        LogFilePrefix: !Sub ${EnvironmentName}-kb-docs-logs/
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  KBDocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KBDocsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub arn:aws:s3:::${KBDocsBucket}
              - !Sub arn:aws:s3:::${KBDocsBucket}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  EmptyKBDocsBucketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EmptyBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:DeleteObject', 's3:DeleteObjectVersion', 's3:ListBucketVersions']
                Resource:
                  - !Sub arn:aws:s3:::${KBDocsBucket}
                  - !Sub arn:aws:s3:::${KBDocsBucket}/*

  EmptyKBDocsBucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt EmptyKBDocsBucketRole.Arn
      Code:
        ZipFile: |
          import boto3, json, urllib.request
          def handler(event, context):
            try:
              if event['RequestType'] == 'Delete':
                bucket = event['ResourceProperties']['BucketName']
                s3 = boto3.resource('s3')
                b = s3.Bucket(bucket)
                b.object_versions.delete()
                b.objects.delete()
              send(event, context, 'SUCCESS', {})
            except Exception as e:
              print(e)
              send(event, context, 'SUCCESS', {})
          def send(event, context, status, data):
            body = json.dumps({'Status': status, 'Reason': 'See CloudWatch', 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}).encode()
            req = urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type': ''}, method='PUT')
            urllib.request.urlopen(req)

  EmptyKBDocsBucket:
    Type: Custom::EmptyBucket
    Properties:
      ServiceToken: !GetAtt EmptyKBDocsBucketFunction.Arn
      BucketName: !Ref KBDocsBucket

  #============================================================================
  # Copy business-context.md from Artifacts to KB Docs Bucket
  #============================================================================
  CopyDocsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-copy-kb-docs-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CopyDocsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::${ArtifactsBucket}/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${KBDocsBucket}/*

  CopyDocsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-copy-kb-docs
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CopyDocsRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3, json, urllib.request
          def send(event, context, status, data={}, reason=''):
              body = json.dumps({'Status': status, 'Reason': reason or 'OK', 'PhysicalResourceId': context.log_stream_name, 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data})
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body.encode(), headers={'Content-Type': ''}, method='PUT'))
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send(event, context, 'SUCCESS')
                  return
              try:
                  import os
                  # Pin to the regional endpoint with path addressing: a just-created bucket
                  # isn't consistently resolvable on the us-east-1 global endpoint yet, so a
                  # default client gets PermanentRedirect on CopyObject. (us-east-1 fresh-deploy race.)
                  s3 = boto3.client('s3', region_name=os.environ['AWS_REGION'],
                                    config=boto3.session.Config(s3={'addressing_style': 'path'}))
                  p = event['ResourceProperties']
                  s3.copy_object(CopySource={'Bucket': p['SrcBucket'], 'Key': p['SrcKey']}, Bucket=p['DstBucket'], Key=p['DstKey'])
                  send(event, context, 'SUCCESS', {'DstBucket': p['DstBucket'], 'DstKey': p['DstKey']})
              except Exception as e:
                  send(event, context, 'FAILED', reason=str(e))

  CopyDocsTrigger:
    Type: Custom::CopyDocs
    DependsOn:
      - KBDocsBucket
      - CopyDocsFunction
    Properties:
      ServiceToken: !GetAtt CopyDocsFunction.Arn
      SrcBucket: !Ref ArtifactsBucket
      SrcKey: !Ref BusinessContextKey
      DstBucket: !Ref KBDocsBucket
      DstKey: docs/business-context.md

  #============================================================================
  # Amazon Bedrock Managed Knowledge Base (native CloudFormation)
  # Bedrock owns the vector store, the embedding model and the reranker, so there
  # is no Aurora/pgvector setup, no embedding model ARN and no custom Lambda.
  #============================================================================
  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-managed-kb-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: ReadKBDocs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt KBDocsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${KBDocsBucket.Arn}/*

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Ref KnowledgeBaseName
      Description: Business context for Timely-Unicorn analytics (metric definitions, rules, example SQL)
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: MANAGED

  KnowledgeBaseDataSource:
    Type: AWS::Bedrock::DataSource
    DependsOn: CopyDocsTrigger
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: business-context-source
      Description: Markdown business context in the KB docs bucket (docs/ prefix)
      # Managed knowledge bases connect to S3 through the managed connector
      # (Type S3 + S3Configuration is only for self-managed knowledge bases).
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: S3
            version: '1'
            connectionConfiguration:
              bucketName: !Ref KBDocsBucket
              bucketOwnerAccountId: !Ref AWS::AccountId
            filterConfiguration:
              inclusionPrefixes:
                - docs/

  #============================================================================
  # First sync: CloudFormation creates the data source but does not ingest it.
  # This small custom resource starts one ingestion job and waits for it, so the
  # agent can retrieve on its first turn. Later syncs: console "Sync" button or
  # StartIngestionJob (the workshop shows both).
  #============================================================================
  IngestionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartIngestion
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetDataSource
                  - bedrock:GetIngestionJob
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn

  IngestionFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Start and wait for the first managed knowledge base sync
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt IngestionRole.Arn
      Timeout: 900
      Code:
        ZipFile: |
          import boto3, json, time, urllib.request
          def send(event, context, status, reason='OK'):
              body = json.dumps({'Status': status, 'Reason': reason[:300], 'PhysicalResourceId': 'kb-ingestion',
                                 'StackId': event['StackId'], 'RequestId': event['RequestId'],
                                 'LogicalResourceId': event['LogicalResourceId'], 'Data': {}})
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body.encode(),
                                     headers={'Content-Type': ''}, method='PUT'))
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  send(event, context, 'SUCCESS'); return
              try:
                  p = event['ResourceProperties']
                  ba = boto3.client('bedrock-agent')
                  # A managed-KB data source is created asynchronously (CREATING -> AVAILABLE,
                  # usually 2-5 min); ingestion can only start once it is AVAILABLE.
                  while context.get_remaining_time_in_millis() > 60000:
                      ds = ba.get_data_source(knowledgeBaseId=p['KnowledgeBaseId'], dataSourceId=p['DataSourceId'])['dataSource']
                      if ds['status'] == 'AVAILABLE':
                          break
                      if ds['status'] in ('DELETE_UNSUCCESSFUL', 'FAILED'):
                          raise RuntimeError('data source ' + ds['status'] + ': ' + '; '.join(ds.get('failureReasons') or []))
                      time.sleep(15)
                  job = ba.start_ingestion_job(knowledgeBaseId=p['KnowledgeBaseId'], dataSourceId=p['DataSourceId'])['ingestionJob']
                  while context.get_remaining_time_in_millis() > 30000:
                      job = ba.get_ingestion_job(knowledgeBaseId=p['KnowledgeBaseId'], dataSourceId=p['DataSourceId'],
                                                 ingestionJobId=job['ingestionJobId'])['ingestionJob']
                      if job['status'] == 'COMPLETE':
                          send(event, context, 'SUCCESS', json.dumps(job.get('statistics', {}), default=str)); return
                      if job['status'] in ('FAILED', 'STOPPED'):
                          send(event, context, 'FAILED', '; '.join(job.get('failureReasons') or [job['status']])); return
                      time.sleep(15)
                  send(event, context, 'FAILED', 'ingestion did not finish in time')
              except Exception as e:
                  send(event, context, 'FAILED', str(e))

  IngestionTrigger:
    Type: Custom::KBIngestion
    Properties:
      ServiceToken: !GetAtt IngestionFunction.Arn
      KnowledgeBaseId: !Ref KnowledgeBase
      DataSourceId: !GetAtt KnowledgeBaseDataSource.DataSourceId
      # Re-sync whenever the source document key changes.
      SourceKey: !Ref BusinessContextKey

Outputs:
  KnowledgeBaseId:
    Description: Bedrock Managed Knowledge Base ID
    Value: !Ref KnowledgeBase
    # NOTE: do not rename — imported by agentcore-topup-stack.yaml (workshop) as
    # ${EnvironmentName}-KnowledgeBaseId. Renaming/removing breaks the import.
    Export:
      Name: !Sub ${EnvironmentName}-KnowledgeBaseId

  KnowledgeBaseArn:
    Description: Bedrock Managed Knowledge Base ARN (for the Gateway connector target)
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn
    Export:
      Name: !Sub ${EnvironmentName}-KnowledgeBaseArn

  DataSourceId:
    Description: Bedrock Data Source ID
    Value: !GetAtt KnowledgeBaseDataSource.DataSourceId
    # Imported by the workshop Step 11 schema-change pipeline.
    Export:
      Name: !Sub ${EnvironmentName}-KnowledgeBaseDataSourceId

  KBDocsBucketName:
    Description: S3 bucket for KB documents
    Value: !Ref KBDocsBucket
    Export:
      Name: !Sub ${EnvironmentName}-KBDocsBucketName
