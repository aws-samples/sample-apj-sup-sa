; TEMPORARY dialplan: prove two-way RTP before trusting the bot.
;
; Installed by scripts/73-echo-test.sh install, removed by ... restore.
; The real dialplan is backed up to /etc/asterisk/extensions.conf.hvi-bak.
;
; WHY THIS EXISTS
; An EC2 instance never sees its Elastic IP on its NIC. If Asterisk is not told
; to advertise the EIP, it puts 10.42.x.x in the SDP, Chime dutifully sends RTP
; to a private address that does not route, and the call connects with total
; silence. That failure is indistinguishable from a broken bot if the bot is the
; first thing you test. So test the media path with no bot in it.
;
; PATTERN: _[+0-9]. not _X. - Asterisk's X matches a digit only, and Chime
; presents the DID in E.164 as '+18005550199'. With _X. every INVITE is rejected
; as "extension not found" and the caller hears nothing but ringing.
;
; PREAMBLE LENGTH IS A CORRECTNESS PROPERTY, NOT COSMETICS.
; The first version of this played demo-congrats (30s) then demo-echotest (22s)
; before reaching Echo, so the echo phase did not begin until ~53 seconds in. A
; caller naturally speaks in the first few seconds, hears nothing back, and
; reports "no echo" - producing a false negative that looks exactly like a
; one-way media fault. The preamble is now ~2s: one short spoken file to prove
; downstream speech is intelligible, then a beep as the cue to talk.

[globals]

[from-chime]
exten => _[+0-9].,1,NoOp(hvi ECHO TEST: ${CALLERID(num)} -> ${EXTEN})
 same => n,Answer()

 ; Record both legs SEPARATELY. RTP counters proved packets flow but cannot tell
 ; speech from digital silence - a G.711 silence stream is indistinguishable from
 ; a healthy one at the packet level. r() captures what we RECEIVE from the
 ; caller, t() captures what we TRANSMIT. Comparing energy across the two is what
 ; identifies which direction is actually carrying signal, independently of what
 ; the caller believes they heard.
 same => n,Verbose(0,hvi echotest: recording both legs)
 same => n,MixMonitor(echo-both.wav,r(/tmp/echo-in.wav)t(/tmp/echo-out.wav))

 ; Let the RTP path settle. Playing into a half-open media path clips the first
 ; word, which on a real call would clip the consent statement.
 same => n,Wait(0.5)

 ; Downstream proof, kept SHORT: ~1s of speech. If this is intelligible then our
 ; transmit path carries real audio, transcodes correctly, and the codec matches.
 same => n,Verbose(0,hvi echotest: playing hello-world)
 same => n,Playback(hello-world)

 ; The cue. Everything after the beep is echoed.
 same => n,Playback(beep)
 same => n,Verbose(0,hvi echotest: entering Echo - speak now)

 ; Round-trip proof: caller -> Asterisk -> caller. Echo() reflects the caller's
 ; own audio, so hearing yourself confirms RTP in BOTH directions. Press # to end.
 same => n,Echo()

 same => n,Verbose(0,hvi echotest: complete)
 same => n,Playback(demo-thanks)
 same => n,Hangup()

; Outbound leg kept identical to the production dialplan so an outbound echo test
; exercises the same trunk path. Same pattern fix as inbound.
[to-chime]
exten => _[+0-9].,1,NoOp(hvi echo test outbound to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@chime,60)
 same => n,Hangup()
