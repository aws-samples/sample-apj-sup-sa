[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemaker-xgboost-pipeline-reference"
version = "0.1.0"
description = "A SageMaker Pipeline flow reference aligned with the SageMaker XGBoost lab."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "awswrangler>=3.9,<4",
  "boto3>=1.34,<2",
  "mlflow==3.10.1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "sagemaker-core==2.18.0",
  "sagemaker-mlflow==0.5.0",
  "sagemaker-mlops==1.18.0",
  "sagemaker-train==1.18.0",
  "scikit-learn>=1.5,<2",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
sagemaker-xgboost-pipeline = "sagemaker_xgboost_pipeline.pipeline:main"
sagemaker-xgboost-pipeline-bootstrap = "sagemaker_xgboost_pipeline.bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sagemaker_xgboost_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
