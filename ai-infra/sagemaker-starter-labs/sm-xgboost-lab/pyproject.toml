[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sagemaker-xgboost-lab"
version = "1.0.0"
description = "A SageMaker XGBoost credit default and managed MLflow learning project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
dependencies = [
  "boto3>=1.34,<2",
  "mlflow==3.16.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "sagemaker-core==2.18.0",
  "sagemaker-train==1.18.0",
  "sagemaker-mlflow==0.5.0",
  "ucimlrepo>=0.0.7",
  "xgboost>=1.7,<2",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
sagemaker-xgboost-lab = "sagemaker_xgboost_lab.train:main"
sagemaker-xgboost-simple = "sagemaker_xgboost_lab.train_simple:main"
sagemaker-xgboost-tune = "sagemaker_xgboost_lab.train_tuner:main"
sagemaker-xgboost-autolog = "sagemaker_xgboost_lab.train_autolog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sagemaker_xgboost_lab = ["autolog-requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
