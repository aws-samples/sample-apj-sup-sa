      Runtime: python3.11
      Handler: create_data_tables.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_data_tables.zip'

  # Association Functions
  AssociateLambdaFunctionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-associate-lambda-functions-${Environment}'
      Runtime: python3.11
      Handler: associate_lambda_functions.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/associate_lambda_functions.zip'

  AssociateLexBotsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-associate-lex-bots-${Environment}'
      Runtime: python3.11
      Handler: associate_lex_bots.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/associate_lex_bots.zip'

  # Check Functions
  CheckFlowDependenciesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-check-flow-dependencies-${Environment}'
      Runtime: python3.11
      Handler: check_flow_dependencies.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/check_flow_dependencies.zip'
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  VerifyMigrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-verify-migration-${Environment}'
      Runtime: python3.11
      Handler: verify_migration.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/verify_migration.zip'
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  # VerifyTarget state: read only checks of the target after the migration phases
  # (lambda/verify_target.py; scripts/deploy.sh bundles the shared modules). Runs as
  # the source reader because the target role trusts only that role; it reads the
  # ExternalId secret, so the state machine runs it before CleanupExternalIdSecret.
  VerifyTargetFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-verify-target-${Environment}'
      Runtime: python3.11
      Handler: verify_target.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Describes every migrated flow, module, queue, user and quick connect; stops
      # 60 seconds before the timeout and reports VerificationIncomplete.
      Timeout: 900
      MemorySize: 512
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/verify_target.zip'

  # Deployed from lambda/check_service_quotas.py (replaces the inline copy in stack 2).
  # Reads source quotas with this role and target quotas through the target role.
  CheckServiceQuotasFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-check-service-quotas-${Environment}'
      Runtime: python3.11
      Handler: check_service_quotas.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/check_service_quotas.zip'
      Environment:
        Variables:
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  # AI agents and vocabulary functions called by the state machine.
  # The list functions run with their own read only roles above. The create
  # functions write through the target role, which trusts only
  # LambdaExecutionRole, so they run as that role.
  ListAiAgentsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-list-ai-agents-${Environment}'
      Runtime: python3.11
      Handler: list_ai_agents.lambda_handler
      Role: !GetAtt ListAiAgentsRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/list_ai_agents.zip'

  ListAiPromptsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-list-ai-prompts-${Environment}'
      Runtime: python3.11
      Handler: list_ai_prompts.lambda_handler
      Role: !GetAtt ListAiPromptsRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/list_ai_prompts.zip'

  ListAiGuardrailsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-list-ai-guardrails-${Environment}'
      Runtime: python3.11
      Handler: list_ai_guardrails.lambda_handler
      Role: !GetAtt ListAiGuardrailsRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/list_ai_guardrails.zip'

  ListVocabulariesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-list-vocabularies-${Environment}'
      Runtime: python3.11
      Handler: list_vocabularies.lambda_handler
      Role: !GetAtt ListVocabulariesRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/list_vocabularies.zip'

  CreateAiAgentsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-create-ai-agents-${Environment}'
      Runtime: python3.11
      Handler: create_ai_agents.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_ai_agents.zip'

  CreateAiPromptsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-create-ai-prompts-${Environment}'
      Runtime: python3.11
      Handler: create_ai_prompts.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_ai_prompts.zip'

  CreateAiGuardrailsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-create-ai-guardrails-${Environment}'
      Runtime: python3.11
      Handler: create_ai_guardrails.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_ai_guardrails.zip'

  CreateVocabulariesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-create-vocabularies-${Environment}'
      Runtime: python3.11
      Handler: create_vocabularies.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      # Waits for each vocabulary to become ACTIVE.
      Timeout: 900
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_vocabularies.zip'

  # BuildMigrationReport state: reads this state machine's execution history.
  BuildMigrationReportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ReadOwnExecutionHistory
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOwnExecutionHistory
                Effect: Allow
                Action: states:GetExecutionHistory
                Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:connect-user-migration-${Environment}:*'

  BuildMigrationReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-build-migration-report-${Environment}'
      Runtime: python3.11
      Handler: build_migration_report.lambda_handler
      Role: !GetAtt BuildMigrationReportRole.Arn
      Timeout: 120
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/build_migration_report.zip'
      Environment:
        Variables:
          EXECUTION_ARN_PREFIX: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:connect-user-migration-${Environment}:'

  # Deletes the per execution ExternalId secret: final state machine step, and the
  # EventBridge backstop in the Step Functions stack (aborted, timed out, failed runs).
  CleanupExternalIdRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: DeleteExternalIdSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeleteExternalIdSecret
                Effect: Allow
                Action: secretsmanager:DeleteSecret
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:connect-migration/${Environment}/*'
              # Dead letter queue of the function: Lambda sends a failed asynchronous
              # (EventBridge backstop) invocation there with this role.
              - Sid: SendToCleanupFailureQueue
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CleanupExternalIdFailureQueue.Arn

  CleanupExternalIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'connect-migration-cleanup-external-id-${Environment}'
      Runtime: python3.11
      Handler: cleanup_external_id.lambda_handler
      Role: !GetAtt CleanupExternalIdRole.Arn
      Timeout: 30
      MemorySize: 128
      # The EventBridge backstop invokes this function asynchronously. A delete that
      # still fails after the retries (CleanupExternalIdEventInvokeConfig) lands here
      # instead of being dropped.
      DeadLetterConfig:
        TargetArn: !GetAtt CleanupExternalIdFailureQueue.Arn
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/cleanup_external_id.zip'
      Environment:
        Variables:
          EXTERNAL_ID_SECRET_PREFIX: !Sub 'connect-migration/${Environment}/'
          # The backstop acts only on status change events of this state machine.
          STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:connect-user-migration-${Environment}'

  # Asynchronous invocations only (the backstop). The state machine step invokes
  # the function synchronously, so its failures go to the state machine instead.
  CleanupExternalIdEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CleanupExternalIdFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2

  # Failed ExternalId secret deletes of the backstop: events the cleanup function
  # still failed on after its retries (function dead letter queue), and events
  # EventBridge could not deliver to it (rule target dead letter queue, Step
  # Functions stack). Each message is the Step Functions status change event;
  # the secret to delete is connect-migration/<env>/<detail.name>. See README.
  CleanupExternalIdFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'connect-migration-cleanup-external-id-failures-${Environment}'
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: !Ref CleanupFailureRetentionSeconds

  CleanupExternalIdFailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CleanupExternalIdFailureQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # The message actions are listed (no sqs:*); the other queue actions
          # can only be called by principals of this account.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:PurgeQueue
            Resource: !GetAtt CleanupExternalIdFailureQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: false
          # Only the backstop rule may send its undeliverable events here.
          - Sid: BackstopRuleDeadLetters
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CleanupExternalIdFailureQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/connect-migration-secret-backstop-${Environment}'

  CleanupExternalIdFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'connect-migration-cleanup-external-id-failures-${Environment}'
      AlarmDescription: >-
        An ExternalId secret delete failed after all retries. Each queue message is
        the status change event of one execution; delete its secret by hand (README).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CleanupExternalIdFailureQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasCleanupFailureAlarmTopic
        - [!Ref CleanupFailureAlarmTopicArn]
        - !Ref AWS::NoValue

Outputs:
  LambdaRoleArn:
    Description: 'ConnectMigrationSourceReader role ARN. Trust this in cloudformation/target-role.yaml.'
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaRoleArn'
  TargetRoleArn:
    Description: 'Target writer role this stack is allowed to assume'
    Value: !Ref TargetRoleArn
  PhoneNumberMoveEnabled:
    Description: 'Whether the UpdatePhoneNumber step is enabled'
    Value: !Ref EnablePhoneNumberMove
  CleanupFailureQueueUrl:
    Description: 'Queue of ExternalId secret deletes that failed after all retries (should stay empty)'
    Value: !Ref CleanupExternalIdFailureQueue
  CleanupFailureQueueArn:
    Description: 'ARN of the cleanup failure queue'
    Value: !GetAtt CleanupExternalIdFailureQueue.Arn
