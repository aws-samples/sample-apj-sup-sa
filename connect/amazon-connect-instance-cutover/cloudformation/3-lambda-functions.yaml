      Handler: create_routing_profiles.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Sub 'lambda/${CodeVersion}/create_routing_profiles.zip'

