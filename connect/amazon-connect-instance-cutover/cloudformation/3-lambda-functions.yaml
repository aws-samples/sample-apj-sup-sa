AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS Connect Migration Tool - Lambda functions and the least privilege
  ConnectMigrationSourceReader execution role. Deploy in the source account.

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name
  CodeVersion:
    Type: String
    Description: Content hash of the Lambda code (set by scripts/deploy.sh) so code changes redeploy
    AllowedPattern: '^[a-f0-9]{8,64}$'
  S3Bucket:
    Type: String
    Description: S3 bucket containing Lambda deployment packages
  SourceInstanceArn:
    Type: String
    Description: ARN of the source Amazon Connect instance (must be in this account)
    AllowedPattern: '^arn:aws[a-z-]*:connect:[a-z0-9-]+:\d{12}:instance/[0-9a-f-]{36}$'
  TargetRoleArn:
    Type: String
    Description: >-
      ARN of the ConnectMigrationTargetWriter role in the target account
      (created by cloudformation/target-role.yaml). The only role this stack may assume.
    AllowedPattern: '^arn:aws[a-z-]*:iam::\d{12}:role/[\w+=,.@/-]+$'
  SourceReaderRoleName:
    Type: String
    Default: ConnectMigrationSourceReader
    Description: >-
      Name of the execution role. The target role trusts this exact role ARN,
      so keep it stable.
    AllowedPattern: '^[\w+=,.@-]{1,64}$'
  AllowedOrigin:
    Type: String
    Description: The only origin allowed by CORS for the API facing functions (the CloudFront URL)
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
  EnablePhoneNumberMove:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Opt in to UpdatePhoneNumber. The tool only moves numbers within one account and
      Region; across accounts or Regions AWS Support moves them or they are ported (the
      migration report names the path). Moving a number takes it away from the source
      instance.
  CleanupFailureRetentionSeconds:
    Type: Number
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600
    Description: >-
      How long the cleanup failure queue keeps a failed ExternalId secret delete,
      in seconds (default and maximum 14 days).
  CleanupFailureAlarmTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:sns:[a-z0-9-]+:\d{12}:[A-Za-z0-9_-]{1,256}$'
    Description: >-
      Optional SNS topic notified when the cleanup failure queue holds a message.
      Empty (the default) creates the alarm without an action.

Conditions:
  HasCleanupFailureAlarmTopic: !Not [!Equals [!Ref CleanupFailureAlarmTopicArn, '']]

Resources:
  # Execution role for every function that reads the source instance and/or
  # writes to the target through the target role. Read only on the source side.
  # Matches the SourceReader and AssumeTargetWriter policies in the README.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn-lint:
        config:
          # cfn-lint's bundled action list predates the Connect Data Tables API
          # (DescribeDataTable, ListDataTables, ...). The actions exist in the
          # Service Authorization Reference.
          ignore_checks: [W3037]
    Properties:
      RoleName: !Ref SourceReaderRoleName
      Description: Connect migration tool - read source instance, assume target writer role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaExecutionRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: SourceReader
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConnectReadSourceInstance
                Effect: Allow
                Action:
                  - connect:BatchDescribeDataTableValue
                  - connect:DescribeContactFlow
                  - connect:DescribeContactFlowModule
                  - connect:DescribeDataTable
                  - connect:DescribeEvaluationForm
                  - connect:DescribeHoursOfOperation
                  - connect:DescribePredefinedAttribute
                  - connect:DescribePrompt
                  - connect:DescribeQueue
                  - connect:DescribeQuickConnect
                  - connect:DescribeRoutingProfile
                  - connect:DescribeRule
                  - connect:DescribeSecurityProfile
                  - connect:DescribeUser
                  - connect:DescribeUserHierarchyGroup
                  - connect:DescribeUserHierarchyStructure
                  - connect:DescribeView
                  - connect:GetPromptFile
                  - connect:ListAgentStatuses
                  - connect:ListBots
                  - connect:ListContactFlowModules
                  - connect:ListContactFlows
                  - connect:ListDataTableAttributes
                  - connect:ListDataTablePrimaryValues
                  - connect:ListDataTableValues
                  - connect:ListDataTables
                  - connect:ListEvaluationForms
                  - connect:ListHoursOfOperations
                  - connect:ListLambdaFunctions
                  - connect:ListPredefinedAttributes
                  - connect:ListPrompts
                  - connect:ListQueues
                  - connect:ListQuickConnects
                  - connect:ListRoutingProfiles
                  - connect:ListRules
                  - connect:ListSecurityProfilePermissions
                  - connect:ListSecurityProfiles
                  - connect:ListUserHierarchyGroups
                  - connect:ListUserProficiencies
                  - connect:ListUsers
                  - connect:ListViews
                  # VerifyTarget compares vocabulary names (the list step has its own role).
                  - connect:SearchVocabularies
                Resource:
                  - !Ref SourceInstanceArn
                  - !Sub '${SourceInstanceArn}/*'
              - Sid: ConnectDescribeAwsManagedViews
                Effect: Allow
                Action: connect:DescribeView
                Resource: !Sub
                  - 'arn:${AWS::Partition}:connect:${Region}:aws:view/*'
                  - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
              - Sid: ConnectListSourcePhoneNumbers
                Effect: Allow
                Action: connect:ListPhoneNumbersV2
                Resource: !Sub
                  - 'arn:${AWS::Partition}:connect:${Region}:${Account}:phone-number/*'
                  - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
                    Account: !Select [4, !Split [':', !Ref SourceInstanceArn]]
              - Sid: LexDescribeSourceBots
                Effect: Allow
                Action:
                  - lex:DescribeBot
                  - lex:DescribeBotAlias
                Resource:
                  - !Sub
                    - 'arn:${AWS::Partition}:lex:${Region}:${Account}:bot/*'
                    - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
                      Account: !Select [4, !Split [':', !Ref SourceInstanceArn]]
                  - !Sub
                    - 'arn:${AWS::Partition}:lex:${Region}:${Account}:bot-alias/*'
                    - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
                      Account: !Select [4, !Split [':', !Ref SourceInstanceArn]]
              - Sid: QConnectListNoResourceLevel
                Effect: Allow
                Action:
                  - wisdom:ListAIAgents
                  - wisdom:ListAIGuardrails
                  - wisdom:ListAIPrompts
                  - wisdom:ListAssistants
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Select [3, !Split [':', !Ref SourceInstanceArn]]
              - Sid: ServiceQuotasReadConnect
                Effect: Allow
                Action: servicequotas:GetServiceQuota
                Resource: !Sub
                  - 'arn:${AWS::Partition}:servicequotas:${Region}:${Account}:connect/*'
                  - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
                    Account: !Select [4, !Split [':', !Ref SourceInstanceArn]]
              - Sid: ServiceQuotasDefaultNoResourceLevel
                Effect: Allow
                Action: servicequotas:GetAWSDefaultServiceQuota
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Select [3, !Split [':', !Ref SourceInstanceArn]]
        - PolicyName: AssumeTargetWriter
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssumeTargetWriter
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Ref TargetRoleArn
        # Read the per execution ExternalId secret written by the start API.
        - PolicyName: ReadExternalIdSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadExternalIdSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:connect-migration/${Environment}/*'

  # Dedicated roles for the list functions the state machine calls but no
  # template used to create. Each gets only the reads it makes; none can
  # assume the target role.
  ListAiAgentsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ReadSourceAiAgents
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: QConnectListNoResourceLevel
                Effect: Allow
                Action:
                  - wisdom:ListAssistants
                  - wisdom:ListAIAgents
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Select [3, !Split [':', !Ref SourceInstanceArn]]
              - Sid: QConnectGetAiAgent
                Effect: Allow
                Action: wisdom:GetAIAgent
                Resource: !Sub
                  - 'arn:${AWS::Partition}:wisdom:${Region}:${Account}:ai-agent/*'
                  - Region: !Select [3, !Split [':', !Ref SourceInstanceArn]]
                    Account: !Select [4, !Split [':', !Ref SourceInstanceArn]]

