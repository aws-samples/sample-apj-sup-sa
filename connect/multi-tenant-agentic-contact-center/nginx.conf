server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ALB / CloudFront health check endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA client-side routing: fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers. The Content-Security-Policy follows the Amazon
        # Connect chat guidance (protect the ChatJS/WebSocket frontend from XSS).
        # Wildcards keep it environment-agnostic while scoping network access:
        #   connect-src -> Cognito (token/idp), API Gateway (cases/chat), and the
        #     Connect participant service + chat WebSocket.
        #   frame-src   -> the embedded Connect CCP (admin Contact Center).
        #   *.chime.aws + worker-src blob: -> Amazon Chime SDK media for the
        #                  opt-in screen-share web call (signaling, TURN, audio worker).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.amazonaws.com wss://*.amazonaws.com https://*.amazoncognito.com https://*.connect.aws wss://*.connect.aws https://*.chime.aws wss://*.chime.aws; worker-src 'self' blob:; frame-src https://*.connect.aws https://*.my.connect.aws https://*.awsapps.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Long-cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
